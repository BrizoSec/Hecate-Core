title: Encoded and Hidden Window PowerShell Command Execution
id: 5a8e1b23-6d90-4f51-a204-71e89cf301a4
status: test
description: Detects PowerShell executions containing encoded command flags combined with hidden window parameters or execution policy bypasses.
references:
  - 'hecate://hunts/H-0003'
  - 'https://attack.mitre.org/techniques/T1059/001/'
author: sec-ops
date: 2026/10/24
tags:
  - attack.execution
  - attack.defense_evasion
  - attack.t1059.001
logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
    Image|endswith:
      - '\powershell.exe'
      - '\pwsh.exe'
  selection_flags:
    CommandLine|contains:
      - ' -enc '
      - ' -encodedcommand '
      - ' -e '
  selection_evasion:
    CommandLine|contains:
      - 'hidden'
      - 'bypass'
  filter_sccm:
    ParentImage|endswith: '\CCM\CcmExec.exe'
  condition: selection_img and selection_flags and selection_evasion and not filter_sccm
falsepositives:
  - Enterprise software deployment and configuration management tools
level: high
