# Agentic Threat Hunting Framework - Docker Compose
#
# ── Quick start (you have an API key) ───────────────────────────────────────
#   cp .env.example .env              # fill in ANTHROPIC_API_KEY or OPENAI_API_KEY
#   docker compose up -d
#   docker compose exec hecate bash
#
# ── Quick start (no API key – uses local Ollama) ────────────────────────────
#   docker compose --profile ollama up -d
#   docker compose exec hecate bash
#   # First run pulls the model (~2 GB); wait for ollama-pull to finish.
#   # Override model: OLLAMA_MODEL=llama3.2:1b docker compose --profile ollama up -d
#
# ── AWS Bedrock ──────────────────────────────────────────────────────────────
#   Uncomment the ~/.aws volume mount below and set AWS_PROFILE in your .env.

services:
  hecate:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: hecate:latest
    container_name: hecate
    volumes:
      - workspace:/workspace
      # Optional: mount AWS credentials for Bedrock
      # - ${HOME}/.aws:/home/hunter/.aws:ro
    environment:
      - TERM=xterm-256color
      # ── LLM provider (auto-detected from whichever key is present) ──────
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      # ── Explicit overrides (optional) ────────────────────────────────────
      - HECATE_LLM_PROVIDER=${HECATE_LLM_PROVIDER:-}
      - HECATE_LLM_MODEL=${HECATE_LLM_MODEL:-}
      # Overrides .hecateconfig.yaml base_url so Docker reaches host Ollama
      - HECATE_LLM_BASE_URL=${HECATE_LLM_BASE_URL:-http://host.docker.internal:11434}
      # ── Ollama ────────────────────────────────────────────────────────────
      # When using --profile ollama, override with: HECATE_LLM_BASE_URL=http://ollama:11434
      - OLLAMA_HOST=${OLLAMA_HOST:-http://host.docker.internal:11434}
      # ── AWS Bedrock ───────────────────────────────────────────────────────
      - AWS_PROFILE=${AWS_PROFILE:-}
      - AWS_REGION=${AWS_REGION:-us-east-1}
      # ── Web search (research agent) ───────────────────────────────────────
      - TAVILY_API_KEY=${TAVILY_API_KEY:-}
    stdin_open: true
    tty: true
    command: /bin/bash

  # ── Local LLM via Ollama (no API key needed) ─────────────────────────────
  # Activate with: docker compose --profile ollama up -d
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    volumes:
      - ollama-models:/root/.ollama
    ports:
      - "11434:11434"
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 30s
    profiles: [ollama]

  # Pulls the default model once on first start, then exits
  ollama-pull:
    image: ollama/ollama:latest
    depends_on:
      ollama:
        condition: service_healthy
    volumes:
      - ollama-models:/root/.ollama
    environment:
      - OLLAMA_HOST=http://ollama:11434
    entrypoint: ["/bin/sh", "-c"]
    command: ["ollama pull ${OLLAMA_MODEL:-qwen2.5:14b}"]
    restart: "no"
    profiles: [ollama]

volumes:
  workspace:
    driver: local
  ollama-models:
    driver: local
