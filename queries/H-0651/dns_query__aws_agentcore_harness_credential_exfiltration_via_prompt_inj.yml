title: AWS AgentCore Harness Credential Exfiltration via Prompt Injection
id: cf24ec00-798e-4f07-b215-39782647a6de
status: experimental
description: Detects DNS queries to known exfiltration domains (webhook.site) which may indicate successful
  prompt injection attacks against AWS AgentCore Harness. Adversaries exploiting the default 'shell' tool
