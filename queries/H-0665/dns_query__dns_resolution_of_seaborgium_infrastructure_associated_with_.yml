title: DNS Resolution of SEABORGIUM Infrastructure Associated with RedFlick Delivery
id: aa7e9d0b-01a4-440d-b2e6-0315b46258c3
status: experimental
description: Detects DNS queries for domains identified in threat intelligence as infrastructure used
  by the Star Blizzard (SEABORGIUM) group. These domains are associated with the delivery of decoy PDFs
  and the CosmicPulse backdoor via the RedFlick technique, which abuses SSH PermitLocalCommand. This rule
  targets the network communication phase of this attack chain.
references:
- https://www.microsoft.com/en-us/security/blog/2026/09/29/star-blizzard-refines-phishing-and-malware-delivery-with-the-redflick-technique/
