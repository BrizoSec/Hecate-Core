title: SSH PermitLocalCommand Abuse for Malicious Payload Download
id: 56d37e93-27b7-49ac-b268-abadccaa2108
status: experimental
description: Detects outbound network connections initiated by ssh.exe that are likely part of the SSH
  PermitLocalCommand abuse technique. This behavior is consistent with the Star Blizzard (SEABORGIUM)
  RedFlick TTP, where legitimate SSH clients are used to execute local commands that download decoy files
  or malware payloads from external servers.
