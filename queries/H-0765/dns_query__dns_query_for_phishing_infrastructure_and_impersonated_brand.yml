title: DNS Query for Phishing Infrastructure and Impersonated Brand Domains
id: ebe8fda5-4fe4-424c-a587-056f0526d629
status: experimental
description: Detects DNS queries for domains associated with a sophisticated Browser-in-the-Browser phishing
  campaign targeting advertising account managers. This rule identifies indicators of compromise including
  credential relay infrastructure on Railway/Render hosts and impersonated AI brand domains used to bypass
  Multi-Factor Authentication.
