    QueryName|contains:
    - ferrar.careers-interview.com
    - redbullapply.careers-appointment.com
    - backend-production-6d75.up.railway.app
  condition: selection_phishing_domains or selection_c2_infrastructure
falsepositives:
- Legitimate users accessing career sites for major brands like Ferrari or Red Bull
- Users interacting with AI-related services or job boards
- Internal DNS forwarding to external resolvers
level: high
