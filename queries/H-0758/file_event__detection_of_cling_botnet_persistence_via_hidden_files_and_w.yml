title: Detection of Cling Botnet Persistence via Hidden Files and Wget Hijacking
id: f427bb54-2d49-48e7-b045-fb551331de5f
status: experimental
description: Detects the creation of hidden files in root directories and the replacement or creation
  of variant wget binaries, which are key persistence mechanisms for the Cling botnet on Linux/IoT devices.
  This behavior indicates an adversary establishing a foothold by modifying system startup scripts and
  replacing legitimate utilities to maintain Command-and-Control capabilities.
references:
- https://www.nozominetworks.com/blog/a-stunning-disguise-cling-malware-masquerades-as-google-
author: hecate (auto-generated draft - requires analyst review)
date: '2026-10-14'
tags:
- attack.t1036
- attack.t1105
logsource:
  category: file_event
detection:
  selection_hidden:
    TargetFilename|endswith: /.cling
  selection_wget_variants:
    TargetFilename|contains:
    - /wget.r
    - /wget.p
  condition: selection_hidden or selection_wget_variants
falsepositives:
- Legitimate system administration creating backup files with .bak or .old extensions (though .r/.p is
  unusual)
- Development environments creating temporary or compiled variants of binaries
- Package manager operations creating backup copies of system binaries
level: high
hunt_id: H-0758
hecate_review:
  verdict: keep
