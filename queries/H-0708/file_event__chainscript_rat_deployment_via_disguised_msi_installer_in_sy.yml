title: ChainScript RAT Deployment via Disguised MSI Installer in System Libraries Path
id: 2e64d88e-88df-4700-89f6-68d841e95ba2
status: experimental
description: Detects the creation of MSI installer files within the %LOCALAPPDATA%\Microsoft\Windows\Libraries
  directory. This specific path is used by the ChainScript threat to disguise malicious installers as
  legitimate system components, facilitating the deployment of a Node.js-based RAT.
