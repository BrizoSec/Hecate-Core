title: Detection of EtherHiding Persistence via Registry Run Keys
id: 1173977b-cee7-41aa-9c26-df30c7cad685
status: experimental
description: Detects the creation or modification of registry run keys under HKCU\Software\Microsoft\Windows\CurrentVersion\Run.
  This behavior is associated with the EtherHiding campaign, where banking trojans establish persistence
  on Windows endpoints to maintain long-term access for credential theft and data exfiltration. The specific
  key name 'PersonalizedUpdates' is not confirmed in source intelligence; this rule targets the generic
  persistence mechanism.
references:
- https://www.guidepointsecurity.com/blog/etherhiding-exposed-deep-dive/
author: hecate (auto-generated draft - requires analyst review)
date: '2026-10-11'
tags:
- attack.t1547.001
logsource:
  category: registry_event
  product: windows
detection:
  selection:
    TargetObject|contains: \CurrentVersion\Run\
  condition: selection
falsepositives:
- Legitimate software installers or updaters that use generic names like 'PersonalizedUpdates' for auto-start
  functionality
- System administration scripts configuring user environment settings
level: medium
hunt_id: H-0705
hecate_review:
  verdict: keep
