description: Detects the execution of PowerShell via ClickFix lures associated with the EtherHiding campaign.
  Adversaries use FakeCaptcha pop-ups on compromised websites to trick users into running a script that
  establishes persistence and resolves blockchain-based C2. This rule targets the specific obfuscated
  PowerShell command line pattern used by the ClickFix dropper.
references:
