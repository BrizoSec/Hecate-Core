  product: windows
detection:
  selection:
    QueryName|contains:
    - skipraid.com
    - 9342371634011778.com
    - linked4x.com
    - finger.linked4x.com
    - api.truesmart.org
    - api.telephoneip.net
    - blob.core.windows.net
  condition: selection
falsepositives:
- Legitimate use of Azure Blob storage for non-malicious content delivery
- Use of skipraid.com or other domains by legitimate software update mechanisms
- CDN traffic resolving to blob.core.windows.net
level: high
