title: DNS Query to SloppyRAT C2 and Staging Domains
id: 6f2820d2-402b-41ec-ad55-a6b54b28fb6d
status: experimental
description: Detects DNS queries for domains associated with the SloppyRAT delivery chain, specifically
  Azure Blob storage endpoints used for downloading malicious payloads (e.g., config.py, hostfxr.dll)
  and known C2 infrastructure. This behavior is indicative of multi-stage ClickFix delivery chains using
  legitimate binaries like finger.exe or pythonw.exe to establish persistence.
references:
- https://www.zscaler.com/blogs/security-research/sloppyrat-new-tool-ransomware-attacks
author: hecate (auto-generated draft - requires analyst review)
date: '2026-10-08'
