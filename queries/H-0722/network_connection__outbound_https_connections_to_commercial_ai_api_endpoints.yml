title: Outbound HTTPS Connections to Commercial AI API Endpoints
id: bc9296e8-a780-4331-8f7c-64bc52f826e4
status: experimental
description: Detects outbound HTTPS connections to known commercial AI model provider endpoints (DeepSeek,
  Qwen, Mistral, Gemini) which are used by CLOSEDQUORUM malware for autonomous decision-making and Command
  and Control. This behavior masks malicious intent within whitelisted traffic.
references:
- https://thehackernews.com/2026/09/windows-malware-is-built-to-let-up-to.html
author: hecate (auto-generated draft - requires analyst review)
date: '2026-10-12'
tags:
- attack.t1071.001
- attack.t1190
logsource:
  category: network_connection
  product: windows
detection:
  selection_ai_domains:
    DestinationHostname|contains: deepseek.com
  selection_qwen_domains:
    DestinationHostname|contains: qwen.ai
  selection_mistral_domains:
    DestinationHostname|contains: mistral.ai
  selection_gemini_domains:
    DestinationHostname|contains: gemini.google.com
  condition: any of selection_*
falsepositives:
- Legitimate AI development tools or IDEs communicating with API providers
- Authorized enterprise applications using AI services for functionality
level: high
hunt_id: H-0722
hecate_review:
  verdict: keep
