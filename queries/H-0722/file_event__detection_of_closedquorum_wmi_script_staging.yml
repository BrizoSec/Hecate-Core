title: Detection of CLOSEDQUORUM WMI Script Staging
id: b4d973e9-0438-49de-8781-6d7b899761e7
status: experimental
description: Detects the creation of a PowerShell script named wmi.ps1 in the Windows Temp directory.
  This file is a specific artifact associated with the CLOSEDQUORUM malware, used to stage malicious code
  for execution or persistence on compromised Windows endpoints.
references:
- https://thehackernews.com/2026/09/windows-malware-is-built-to-let-up-to.html
author: hecate (auto-generated draft - requires analyst review)
date: '2026-10-12'
tags:
- attack.t1053.005
logsource:
  category: file_event
  product: windows
detection:
  selection:
    TargetFilename|endswith: \wmi.ps1
  condition: selection
falsepositives:
- Legitimate system administration scripts or WMI diagnostic tools writing temporary files to the Temp
  directory.
- Automated patching or configuration management software creating temporary PowerShell scripts.
level: high
hunt_id: H-0722
hecate_review:
  verdict: keep
