title: Casbaneiro AutoIt Loader Registry Persistence via HKCU\SOFTWARE
id: 44d03026-c76b-4809-b7a7-e212229d121a
status: experimental
description: Detects the creation of registry keys under HKCU\SOFTWARE, which is used by Casbaneiro AutoIt
  loaders to store configuration or payload paths for persistence. This targets the specific T1547.001
  technique mentioned in the hypothesis.
references:
- https://www.fortinet.com/blog/threat-research/casbaneiro-a-banking-trojan-with-distributed-data-receiving-servers
author: hecate (auto-generated draft - requires analyst review)
date: '2026-10-08'
tags:
- attack.t1547.001
logsource:
  category: registry_event
  product: windows
detection:
  selection:
    TargetObject|contains: HKCU\SOFTWARE
  condition: selection
falsepositives:
- Legitimate software installers writing configuration to HKCU\SOFTWARE
- Application updates modifying user settings
- Office add-ins or plugins registering themselves
level: medium
hunt_id: H-0660
hecate_review:
  verdict: revise
  issues:
  - The rule detects any registry key under HKCU\SOFTWARE containing 'HKCU\SOFTWARE', which is overly
    broad and will generate massive false positives from legitimate software.
  - The hypothesis and passages specify that the malware creates a folder named after the MD5 hash in
    %TEMP% (Passage 4) and a registry key named after the MD5 hash in HKCU\SOFTWARE (Passage 5). The rule
    fails to target this specific naming convention or behavior, instead targeting the parent path generically.
  - The description claims it targets T1547.001 (Registry Run Keys / Startup Folder), but the passages
    describe creating a key named after an MD5 hash, which is more indicative of configuration storage
    or persistence via arbitrary registry keys rather than standard auto-execution paths like 'Run'.
  unverified_contradiction: 'The rule does not contradict the existence of the registry activity, but
    it fails to align with the specific indicator described in the hypothesis and passages. The hypothesis
    states: ''Adversaries use AutoIt loaders... to exfiltrate stolen financial data while evading detection
    on specific Latin American targets via IP-based geofencing.'' Passage 5 states: ''The other is a registry
    key named after the MD5 hash in HKCU\SOFTWARE.'' The rule ignores the ''named after the MD5 hash''
    constraint, making it ineffective for the specific threat described.'
