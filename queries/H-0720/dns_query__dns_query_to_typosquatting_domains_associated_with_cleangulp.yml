title: DNS Query to Typosquatting Domains Associated with CLEANGULP Delivery
id: c6875c67-6341-4997-a1ec-5cd6df2897dd
status: experimental
description: Detects DNS queries for domains identified in threat intelligence as being used by UTA0565
  to deliver the CLEANGULP backdoor via typosquatting legitimate entities. These domains are used to host
  malicious payloads such as chrome_cleanup.exe, which exploits Chrome and Windows vulnerabilities to
  establish persistence.
