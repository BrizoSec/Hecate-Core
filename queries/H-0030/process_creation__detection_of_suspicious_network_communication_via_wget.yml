title: Detection of Suspicious Network Communication via wget
id: 625be56f-587f-4c2a-bcc6-0afeca3e0d8c
status: experimental
description: Detects the use of wget to establish command and control on compromised Linux systems, which
  is a common technique used by adversaries for downloading malicious payloads or communicating with C2
  servers.
references:
