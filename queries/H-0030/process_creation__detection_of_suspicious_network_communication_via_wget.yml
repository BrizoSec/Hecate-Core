author: hecate (auto-generated draft - requires analyst review)
date: '2026-09-13'
tags:
- attack.t1059.003
logsource:
  category: process_creation
detection:
  selection:
    CommandLine|contains: wget
  filter:
    ParentImage|contains: /usr/bin/bash
  condition: selection and not filter
falsepositives:
