title: Execution of HEAVYGRAM Disguised as Legitimate Applications from Temporary Directories
id: fb3028cb-941d-4461-8d25-f027f2fc07e5
status: experimental
description: Detects the execution of files masquerading as legitimate applications (Telegram, Pictory)
  or known HEAVYGRAM variants (RuntimeSSH) originating from temporary directories. This behavior aligns
  with the HEAVYGRAM threat actor's social engineering delivery method, where malware is dropped in %TEMP%
  and executed to establish persistence and C2 via Telegram Bot API.
references:
- https://www.group-ib.com/blog/heavygram-handala-hack-telegram-c2/
author: hecate (auto-generated draft - requires analyst review)
date: '2026-10-10'
tags:
- attack.t1036
logsource:
  category: process_creation
  product: windows
detection:
  selection_executables:
    Image|endswith: \\
    CommandLine|contains:
    - Telegram.exe
    - RuntimeSSH.exe
    - Pictory_premium_ver
  selection_temp:
    Image|startswith: '%TEMP%'
  condition: selection_executables and selection_temp
falsepositives:
- Legitimate software installers or updaters dropping files in %TEMP% before execution
- User-installed portable applications placed in temporary folders by the user
level: high
hunt_id: H-0695
hecate_review:
  verdict: keep
