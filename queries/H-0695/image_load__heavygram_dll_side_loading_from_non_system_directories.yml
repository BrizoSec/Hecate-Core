title: HEAVYGRAM DLL Side-Loading from Non-System Directories
id: caf54ffc-770f-4394-952a-1b11a9d5730c
status: experimental
description: Detects the DLL side-loading technique used by HEAVYGRAM. The malware masquerades as legitimate
  applications (e.g., Telegram.exe, Pictory) to load malicious or unexpected DLLs from non-standard directories
  (such as %TEMP%) instead of trusted system paths like C:\Windows\System32\. This rule targets the specific
  behavior of loading a DLL that is signed but originates from an unusual location, which is a key indicator
  of this threat.
references:
- https://www.group-ib.com/blog/heavygram-handala-hack-telegram-c2/
author: hecate (auto-generated draft - requires analyst review)
date: '2026-10-10'
tags:
- attack.t1574.001
logsource:
  category: image_load
  product: windows
detection:
  selection:
    ImageLoaded|endswith: .dll
    Signed: 'true'
    ImageLoaded|startswith: \\
  filter_system32:
    ImageLoaded|contains: \Windows\System32\
  condition: selection and not filter_system32
falsepositives:
- Legitimate applications loading DLLs from their own installation directories (e.g., Program Files)
- Software updaters or installers extracting and loading temporary DLLs
- Virtualization software or drivers loading helper libraries
level: high
hunt_id: H-0695
hecate_review:
  verdict: keep
