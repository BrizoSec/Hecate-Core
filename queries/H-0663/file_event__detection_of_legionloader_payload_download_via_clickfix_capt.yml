title: Detection of LegionLoader Payload Download via ClickFix CAPTCHA Page
id: 1594de92-bf78-482f-89c7-b174269a371f
status: experimental
description: Detects the creation of files in temporary directories that are likely downloaded from malicious
  domains associated with the 'ClickFix' tactic. Adversaries use fake Cloudflare CAPTCHA pages to trick
  users into executing PowerShell commands that download and execute the LegionLoader malware. This rule
  targets the file write event resulting from the initial payload delivery stage.
references:
- https://asec.ahnlab.com/en/95374/
author: hecate (auto-generated draft - requires analyst review)
date: '2026-10-08'
tags:
- attack.t1036
- attack.t1566.001
logsource:
  category: file_event
  product: windows
detection:
  selection:
    TargetFilename|contains: /temp/
    Image|endswith: \powershell.exe
  condition: selection
falsepositives:
- Legitimate software installers or updaters writing to temp folders
- Browser cache operations
- System maintenance scripts
level: high
hunt_id: H-0663
hecate_review:
  verdict: keep
