title: Oracle PeopleSoft Web Shell and Backdoor Staging via JSP and Trojanized Installer
id: e1835368-846b-4dc4-aea2-eefad2334865
status: experimental
description: Detects the creation of specific JSP web shells used for WAF bypass and command execution,
  as well as the deployment of a trojanized installer (Ple64.exe) delivering the SIDEEYE backdoor on Oracle
  PeopleSoft servers. This behavior aligns with UNC6240 (ShinyHunters) TTPs involving CVE-2026-35273 exploitation
  and subsequent persistence via MeshAgent.
references:
- https://cloud.google.com/blog/topics/threat-intelligence/shinyhunters-renewed-mass-exploitation-campaign-targeting-oracle-peoplesoft
author: hecate (auto-generated draft - requires analyst review)
date: '2026-10-13'
tags:
- attack.t1027
- attack.t1036
logsource:
  category: file_event
  product: windows
detection:
  selection_webshells:
    TargetFilename|contains: PSEMHUB.war
    TargetFilename|endswith: .jsp
  selection_backdoor_installer:
    TargetFilename|endswith: \Ple64.exe
  condition: selection_webshells or selection_backdoor_installer
falsepositives:
- Legitimate PeopleSoft application updates or patches that may write to the PSEMHUB.war directory
- Administrative maintenance scripts deploying standard JSP files
level: high
hunt_id: H-0735
hecate_review:
  verdict: keep
