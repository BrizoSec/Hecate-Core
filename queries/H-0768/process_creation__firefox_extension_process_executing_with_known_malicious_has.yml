hunt_id: H-0768
hecate_review:
  verdict: reject
  issues:
  - 'The rule uses `logsource: category: process_creation` but attempts to detect network domains via
    `Image|contains`. The `Image` field in process creation logs contains the executable file path (e.g.,
    `C:\Program Files\Mozilla Firefox\firefox.exe`), not network destinations. Domains like `icy-star-f45c.workers.dev`
    will never appear in the `Image` field of a process creation event.'
  - The rule contradicts the nature of the indicator. The passages describe these domains as C2 endpoints
    contacted by the extension code, not as part of the executable image path.
  unverified_contradiction: The rule attempts to match network domains against the process image path,
    which is technically impossible and contradicts the definition of the `Image` field in process creation
    logs.
