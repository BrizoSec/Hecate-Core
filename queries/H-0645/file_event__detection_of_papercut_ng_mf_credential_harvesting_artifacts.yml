title: Detection of PaperCut NG/MF Credential Harvesting Artifacts
id: c15d8140-bf70-4f67-adec-db201afb34d1
status: experimental
description: Detects the creation of specific file artifacts associated with a threat campaign targeting
  PaperCut NG/MF. Adversaries use custom tools to dump SYSTEM/SECURITY hives and deploy credential harvesting
  utilities like lsa_collect.exe and Ligolo-ng proxies for lateral movement.
references:
- https://www.greynoise.io/blog/ai-orchestrated-campaign-against-papercut-ng-mf
author: hecate (auto-generated draft - requires analyst review)
date: '2026-10-07'
tags:
- attack.t1003.001
- attack.t1003.004
logsource:
  category: file_event
  product: windows
detection:
  selection:
    TargetFilename|endswith:
    - \Administrator17.exe
    - \pc-sys.hiv
    - \pc-sec.hiv
    - \pc-security.hiv
    - \pc-system.hiv
    - \pc-sys-reg.hiv
    - \pc-*.b64
    - \ligolo-agent.exe
    - \lsa_collect.exe
    - \pcp_*.txt
    - \legit-svc.exe
    - \legit-svc-backup.exe
  condition: selection
falsepositives:
- Legitimate PaperCut NG/MF installation or update processes creating temporary files in C:\Windows\Temp
  or C:\ProgramData
- System administration scripts dumping registry hives for backup purposes
- Security tools performing credential auditing with certipy or similar utilities
level: high
