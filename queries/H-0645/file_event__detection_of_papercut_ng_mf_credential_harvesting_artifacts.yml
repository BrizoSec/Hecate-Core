hecate_review:
  verdict: revise
  issues:
  - The rule includes '\Administrator17.exe' in the detection list, but Passage [8] identifies 'Administrator17'
    as an 'Adversary created account', not a file or executable. This is a factual error regarding the
    artifact type.
  - The rule uses 'endswith' logic for filenames like '\pc-*.b64'. In Sigma, wildcards in 'endswith' are
    often not supported or behave unpredictably depending on the backend; standard practice is to use
    'contains' or specific regex patterns. However, the primary issue is the inclusion of non-file artifacts.
  - The rule lists '\lsa_collect.exe' and '\ligolo-agent.exe'. Passage [21] shows the download URL for
    'lsa_collect.exe', but Passage [15] explicitly names the Ligolo-ng artifact as 'ligolo-agent.exe'
    while Passages [23-24] show it being renamed to 'legit-svc.exe'. Including both is acceptable for
    coverage, but the inclusion of the account name as a file path is a critical error.
  unverified_contradiction: The rule treats 'Administrator17' as a file artifact (executable) to be detected
    via filename matching, whereas the source passage explicitly defines it as an account.
