title: Web3 Supply Chain Compromise via Infected npm Dependencies on macOS
id: c36d9b8b-4377-4aff-aebc-562bc1a026b5
status: experimental
description: Detects the creation of files associated with known backdoored npm packages identified in
  Unit 42's Web3 cloud supply chain attack report. This rule targets the persistence mechanism where attackers
  compromise open-source registries (npm, crates.io) to distribute malicious dependencies like 'keyv'
  and 'cacheable-request' to developer workstations. While the hypothesis mentions process execution of
  custom Bun runtimes, this file_event rule specifically hunts for the disk artifacts written during the
  dependency installation phase, which is a prerequisite for the subsequent credential harvesting and
  C2 activities.
