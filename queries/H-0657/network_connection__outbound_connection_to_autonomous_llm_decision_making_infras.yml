logsource:
  category: network_connection
  product: windows
detection:
  selection_malware:
    Image|endswith: \CAIRN.exe
  selection_llm:
    DestinationHostname|contains:
    - api.mistral.ai
    - api.deepseek.com
    - openrouter.ai
    - cdn.discordapp.com
  condition: selection_malware and selection_llm
falsepositives:
