title: Outbound Connection to Autonomous LLM Decision-Making Infrastructure by Suspicious Executables
id: 8a5d026c-fa76-40dc-9f88-497341ef7dfb
status: experimental
description: Detects outbound network connections from suspicious or known malicious executables (CLOSEDQUORUM,
  CAIRN) to domains associated with commercial Large Language Model APIs. This behavior indicates the
  malware is offloading tactical post-exploitation decisions (such as credential theft or process injection
  selection) to an autonomous LLM engine without human intervention.
references:
- https://blog.talosintelligence.com/the-closed-quorum-inside-the-first-reported-autonomous-ai-c2-implant/
author: hecate (auto-generated draft - requires analyst review)
