title: DNS Queries to LLM APIs by Non-Browser Executables Indicating Autonomous Decision-Making
id: 8d91ce83-6c54-4915-b9a3-ce03b6142b70
status: experimental
description: Detects DNS queries to commercial Large Language Model API endpoints (DeepSeek, OpenRouter,
  Mistral) initiated by non-browser Windows executables. This behavior indicates the CLOSEDQUORUM malware
  performing autonomous, AI-driven tactical decision-making for post-exploitation capabilities, as it
  queries these APIs to determine subsequent actions like credential theft or process injection.
references:
- https://blog.talosintelligence.com/the-closed-quorum-inside-the-first-reported-autonomous-ai-c2-implant/
author: hecate (auto-generated draft - requires analyst review)
date: '2026-10-07'
tags:
- attack.t1573
logsource:
  category: dns_query
  product: windows
detection:
  selection_query:
    QueryName|endswith:
    - api.mistral.ai
    - api.deepseek.com
    - openrouter.ai
    - cdn.discordapp.com
  selection_exec:
    Image|endswith: \rundll32.exe
  condition: selection_query and selection_exec
falsepositives:
- Legitimate developer tools or IDEs using LLM APIs for code assistance
- Enterprise software updates or telemetry services integrating with OpenRouter or Mistral
- Research or testing environments explicitly configured to use these AI services
level: high
