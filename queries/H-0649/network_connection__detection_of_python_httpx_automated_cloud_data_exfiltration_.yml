title: Detection of python-httpx Automated Cloud Data Exfiltration via Passkey Phishing
id: 3f2e92af-5319-4199-aede-311dcd0a19c4
status: experimental
description: Detects the use of the python-httpx library to automate access to Microsoft Graph API endpoints.
  This behavior is consistent with Storm-3121/Storm-3032 actors who compromise identities via passkey-themed
  phishing and subsequently use automated scripts to exfiltrate data from SharePoint, OneDrive, and Exchange.
references:
- https://www.microsoft.com/en-us/security/blog/2026/09/09/passkey-themed-social-engineering-leads-identity-cloud-compromise/
author: hecate (auto-generated draft - requires analyst review)
date: '2026-10-07'
tags: []
logsource:
  category: network_connection
detection:
  selection:
    Image|endswith: /python-httpx
  condition: selection
falsepositives:
- Legitimate Python scripts using the httpx library for API integration
- Automated monitoring tools or CI/CD pipelines making HTTP requests
- Developers testing web applications
level: high
hunt_id: H-0649
hecate_review:
  verdict: revise
  issues:
  - The rule relies on detecting the binary name '/python-httpx', which is highly unreliable and likely
    to miss the actual behavior described (using the python-httpx *library* within a Python script). The
    source passages do not mention a specific executable named 'python-httpx', but rather the library
    usage.
  - 'The rule title and description conflate two distinct phases: ''Passkey Phishing'' (the initial compromise
    vector) and ''Automated Cloud Data Exfiltration'' (the post-compromise action). While related, a detection
    rule for exfiltration should focus on the exfiltration indicators (e.g., Graph API calls, specific
    permissions like Mail.Read/Files.Read.All mentioned in passages 7-9) rather than just the tool used
    to initiate it, especially since the tool name is not explicitly confirmed as a standalone binary
    in the text.'
  - The rule lacks specificity regarding the 'Microsoft Graph API' context which is central to the hypothesis.
    It only detects network connections involving python-httpx, which could be legitimate traffic.
