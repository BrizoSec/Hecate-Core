title: DNS Query to Passkey Phishing Infrastructure Domains
id: 9ae4c88d-50dd-45b2-ba72-4d717ef26361
status: experimental
description: Detects DNS queries to known domains associated with Storm-3121/Storm-3032 passkey-themed
