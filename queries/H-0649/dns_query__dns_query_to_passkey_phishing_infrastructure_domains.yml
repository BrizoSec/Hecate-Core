hunt_id: H-0649
hecate_review:
  verdict: revise
  issues:
  - 'The rule focuses solely on DNS queries to phishing infrastructure domains, which only detects the
    initial credential harvesting phase (AiTM phishing). It fails to detect or correlate with the core
    hypothesis components: ''unauthorized MFA persistence'', ''access Microsoft Graph API'', and ''automated
    data exfiltration''.'
  - The rule ignores the critical indicator of compromised identity accounts accessing Microsoft Graph
    API, which is explicitly detailed in passages [7], [8], [9], and [10] as the method for cloud reconnaissance
    and data exfiltration.
  - The detection logic is too narrow; it misses the actual malicious activity (Graph API abuse) described
    in the hypothesis, relying only on the precursor phishing domains.
