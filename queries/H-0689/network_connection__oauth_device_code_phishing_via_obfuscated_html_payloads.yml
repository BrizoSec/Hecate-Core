title: OAuth Device Code Phishing via Obfuscated HTML Payloads
id: cbef260c-6bb6-4b3e-8c31-d01bff8c24cf
status: experimental
description: Detects network connections to known GhostCode campaign infrastructure used for OAuth 2.0
  device code phishing. This technique abuses the Microsoft Device Authorization Grant flow to bypass
  traditional MFA prompts and harvest Primary Refresh Tokens (PRT). The rule matches traffic to specific
  malicious domains, IPs, and URLs associated with the obfuscated HTML payloads delivering the phishing
  kit.
references:
- https://www.esentire.com/blog/ghostcode-dissecting-a-novel-device-code-phishing-kit
