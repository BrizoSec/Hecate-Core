title: Detection of OAuth Device Code Phishing via Primary Refresh Token Acquisition
id: 9f5672e1-3620-4a1c-97cc-d3d4895fe08c
status: experimental
description: Detects the acquisition of a Primary Refresh Token (PRT) via the Microsoft OAuth 2.0 Device
  Authorization Grant flow. This technique is used by campaigns like GhostCode to bypass traditional MFA
  prompts and establish persistent access to Microsoft 365 accounts without triggering standard interactive
  login alerts.
references:
- https://www.esentire.com/blog/ghostcode-dissecting-a-novel-device-code-phishing-kit
author: hecate (auto-generated draft - requires analyst review)
date: '2026-10-10'
tags:
- attack.t1098.005
- attack.t1556.006
logsource:
  category: authentication
detection:
  selection:
    TargetUserName|endswith: '@microsoft.com'
    AuthenticationPackageName: MSV1_0
    LogonType: 7
    SubStatus: '0x0'
  condition: selection
falsepositives:
- Legitimate device registration for Azure AD joined devices
- Windows Hello for Business setup on new hardware
- Automated provisioning scripts using device code flow
level: high
hunt_id: H-0689
hecate_review:
  verdict: reject
  issues:
  - 'The rule relies on Windows Event Log fields (LogonType: 7, AuthenticationPackageName: MSV1_0) which
    are characteristic of Kerberos/NTLM authentication on Windows endpoints. The hypothesis and passages
    describe an OAuth 2.0 Device Code Phishing attack targeting Microsoft 365 accounts via a web-based
    flow (HTML payloads, Cloudflare Turnstile, API calls). This technique does not generate these specific
    Windows security events in the manner described; it generates Azure AD/Entra ID sign-in logs or browser
    telemetry, not local Windows logon events with LogonType 7.'
  unverified_contradiction: 'The rule specifies detection via ''LogonType: 7'' and ''AuthenticationPackageName:
    MSV1_0'', which are Windows local/logon event indicators. The source passages describe a web-based
    OAuth device code phishing campaign involving HTML files, redirect URLs, Cloudflare challenges, and
    API calls to harvest tokens, with no mention of Windows logon events or MSV1_0 authentication packages
    being the primary detection vector for this specific attack chain.'
