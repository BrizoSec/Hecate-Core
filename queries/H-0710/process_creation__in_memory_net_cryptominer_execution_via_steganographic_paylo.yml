title: In-Memory .NET Cryptominer Execution via Steganographic Payload Extraction
id: c7646b1a-11ed-42c4-a7a2-1f06633a631a
status: experimental
description: Detects the execution of a cryptominer process configured with specific command-line arguments
  for XMRig, likely loaded in-memory from steganographic payloads stored in registry keys or media files.
  This behavior indicates active defense evasion and cryptocurrency mining on compromised endpoints.
references:
- https://labs.k7computing.com/index.php/from-registry-stored-powershell-to-in-memory-cryptocurrency-mining-a-multi-stage-infection-chain/
author: hecate (auto-generated draft - requires analyst review)
date: '2026-10-11'
tags:
- attack.t1027
- attack.t1053.005
- attack.t1059.001
- attack.t1204.002
- attack.t1620
logsource:
  category: process_creation
  product: windows
detection:
  selection_cmdline:
    CommandLine|contains: -a rx/0 -o xmr-asiannanopoolorg:10343 --keepalive -u <Alphanumeric value> -p
      x --tls --cpu-max-threads-hint=40
  selection_files:
    CommandLine|contains: WinRing0.sys
  condition: selection_cmdline or selection_files
falsepositives:
- Legitimate audio processing tools using WinRing0 for hardware monitoring
- Custom mining pool configurations with different URLs or ports
- System administration scripts utilizing WAV files for audio playback testing
level: high
hunt_id: H-0710
hecate_review:
  verdict: revise
  issues:
  - 'The rule uses `logsource: category: process_creation` but detects `CommandLine|contains: WinRing0.sys`.
    The source passages state that `WinRing0.sys` is a ''dropped'' file (passage 11) and an IOC, not a
    command-line argument of the running process. Detecting a filename in the CommandLine field will likely
    yield false negatives or incorrect detections.'
  - The rule relies on detecting specific XMRig command-line arguments (`-a rx/0 -o xmr-asiannanopoolorg:10343`).
    While passage 10 mentions this configuration, it is part of a debugging observation. The hypothesis
    focuses on 'steganographic payload extraction' and 'in-memory .NET cryptominers'. A rule detecting
    the miner process itself misses the core hunting objective of detecting the *extraction* mechanism
    (Registry/DNS/Stego) described in the hypothesis.
  - 'The `condition: selection_cmdline or selection_files` is logically flawed because `selection_files`
    checks the CommandLine for ''WinRing0.sys'', which is not a valid command-line argument for the miner
    process itself, but rather a file on disk.'
  unverified_contradiction: The rule attempts to detect 'WinRing0.sys' within the CommandLine field of
    a process creation log. Passage 11 states that the executable 'dropped WinRing0.sys', implying it
    is a file written to disk, not a command-line argument passed to the cryptominer process.
