title: Detection of MATCHBOIL Persistence via HKCU Run Key Modification
id: c833610e-4cc2-46d1-aaad-b36789647c08
status: experimental
description: Detects the creation or modification of registry keys under HKCU\Software\Microsoft\Windows\CurrentVersion\Run,
  a common persistence mechanism used by the MATCHBOIL malware family (UAC-0099) to ensure the MATCHWOK
  backdoor executes at user logon. This rule targets the specific registry path identified in the intelligence
  as being utilized for this purpose.
references:
- https://www.welivesecurity.com/en/eset-research/matchboil-new-tricks-same-old-evil-intentions/
