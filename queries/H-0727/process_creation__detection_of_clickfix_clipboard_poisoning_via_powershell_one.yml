title: Detection of ClickFix Clipboard Poisoning via PowerShell One-Liner
id: 56e2bdda-08ef-4c31-956e-4a999f3b3eff
status: experimental
description: Detects the execution of a specific PowerShell one-liner used in active ClickFix campaigns.
  Adversaries use this command to download and execute remote code via the Run dialog, bypassing file-based
  detection by loading payloads into memory.
references:
- https://www.manifold.security/blog/third-party-com-placeholder-clickfix
author: hecate (auto-generated draft - requires analyst review)
date: '2026-10-12'
tags:
