title: Warden Stealer Loader Execution via Known Malicious Hashes
id: ae08acdc-10cf-4585-9e85-d733c2a47500
status: experimental
description: Detects the execution of binaries matching known Warden Stealer loader hashes. These loaders
  are used to inject into explorer.exe processes to exfiltrate AI assistant tokens and cryptocurrency
  wallet data, bypassing Application-Bound Encryption.
references:
- https://www.gendigital.com/blog/insights/research/warden-stealer-rust-infostealer-analysis
author: hecate (auto-generated draft - requires analyst review)
date: '2026-10-15'
tags:
- attack.t1027
- attack.t1059.003
- attack.t1204.004
- attack.t1620
logsource:
  category: process_creation
  product: windows
detection:
  selection_warden_hashes:
    Image|endswith: \Warden Stealer.exe
  condition: selection_warden_hashes
falsepositives:
- Legitimate software with similar naming conventions
- Custom internal tools using common names
level: high
hunt_id: H-0779
hecate_review:
  verdict: reject
  issues:
  - The rule uses a filename pattern `\Warden Stealer.exe` which is not supported by Sigma syntax for
    file paths (should use `endswith` with the full path or `contains`, but more importantly, the filename
    itself is fabricated).
  - The source passages never mention a file named 'Warden Stealer.exe'. They refer to 'Warden Stealer
    loader binaries' and provide specific SHA-256 hashes (e.g., 006510ce..., 04beeb71...) but no filename
    matching this pattern.
  unverified_contradiction: The rule assumes a specific filename 'Warden Stealer.exe' exists, but the
    report only provides hashes and describes them as 'loader binaries' without specifying this exact
    executable name. The report lists SHA-256 hashes for 'Warden Loader' and 'Warden Stealer' but does
    not name the file 'Warden Stealer.exe'.
