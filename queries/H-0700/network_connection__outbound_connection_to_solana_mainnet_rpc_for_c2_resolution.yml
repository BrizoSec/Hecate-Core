hecate_review:
  verdict: revise
  issues:
  - The rule includes 'deadhub.org' and 'torrents.org' in the detection logic, but the source passages
    do not describe outbound network connections to these domains as part of the C2 resolution mechanism.
    Passage [5] states the loader decodes 'deadhub.org' but then uses an IP address if that connection
    fails; it does not confirm a successful outbound connection to deadhub.org is the primary detection
    target for C2 resolution. Passage [1] and [2] describe itorrents.org as a compromised repository for
    distributing files, not as a destination for outbound C2 connections from the endpoint.
  - The rule title specifies 'Solana Mainnet RPC', but the detection condition includes non-Solana domains
    (deadhub.org, itorrents.org), which dilutes the specificity and contradicts the precise behavior described
    in Passage [8] and [10] regarding Solana C2 resolution.
