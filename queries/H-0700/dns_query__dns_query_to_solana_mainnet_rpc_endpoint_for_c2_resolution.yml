title: DNS Query to Solana Mainnet RPC Endpoint for C2 Resolution
id: 95923aab-0166-4771-9e8e-89030e1d9b58
status: experimental
description: Detects DNS queries for api.mainnet.solana.com, which is used by the MovieReaper campaign
  to resolve C2 infrastructure via the Solana blockchain. This behavior bypasses traditional IP/domain
  blocklists as the actual C2 addresses are retrieved from the blockchain state rather than hardcoded
  in the malware binary.
