title: Detection of AdaptixC2/Akira Ransomware Delivery Artifacts via File Creation
id: 8a3b55c0-bafd-4829-931f-296eee508d3b
status: experimental
description: Detects the creation of specific file artifacts associated with the AdaptixC2 and Akira ransomware
  campaign, including renamed legitimate utilities (AdgNsy.exe, icardagt.exe) used for DLL sideloading
  and shellcode injection.
references: []
author: hecate (auto-generated draft - requires analyst review)
date: '2026-10-06'
tags:
- attack.t1053.005
- attack.t1574.001
logsource:
  category: file_event
  product: windows
detection:
  selection_adgnsy:
    TargetFilename|endswith: \AdgNsy.exe
  selection_icardagt:
    TargetFilename|endswith: \icardagt.exe
  condition: selection_adgnsy or selection_icardagt
falsepositives:
- Legitimate installation of ManageEngine OpManager (if icardagt.exe is part of the installer)
- Renamed system utilities for troubleshooting
