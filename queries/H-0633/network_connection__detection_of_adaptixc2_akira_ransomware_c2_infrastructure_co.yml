title: Detection of AdaptixC2/Akira Ransomware C2 Infrastructure Communication
id: be8cba1b-6c9b-434f-9768-53d97a091e8d
status: experimental
description: Detects network connections to specific domains identified in threat intelligence as being
  used for command and control (C2) and payload delivery by the AdaptixC2 and Akira ransomware campaign.
  This activity often follows initial access via renamed utilities like AdgNsy.exe or DLL sideloading
  via icardagt.exe.
