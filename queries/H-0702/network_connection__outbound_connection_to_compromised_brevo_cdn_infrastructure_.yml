title: Outbound Connection to Compromised Brevo CDN Infrastructure sendibt1.com
id: 20726ab0-555d-4097-a560-cfffefdb1740
status: experimental
description: Detects outbound network connections to the specific compromised CDN infrastructure (cdn.sendibt1.com)
  and associated IP addresses used in the Brevo supply chain attack. Adversaries injected malicious JavaScript
  loaders into legitimate SDK assets via these domains to deliver WordPress backdoors and ClickFix malware.
  This rule identifies clients communicating with the full attacker-controlled domain or its resolved
  IPs.
references:
- http://sansec.io/research/brevo-supply-chain-attack
author: hecate (auto-generated draft - requires analyst review)
date: '2026-10-11'
tags:
- attack.t1059.007
- attack.t1113
- attack.t1195.002
- attack.t1204.004
logsource:
  category: network_connection
detection:
  selection_domain:
    DestinationHostname|endswith:
    - cdn.sendibt1.com
    - ecomscan.com
    - cdn2.sendibt1.com
    - cdn3.sendibt1.com
    - cdn4.sendibt1.com
    - cdn9.sendibt1.com
    - cdn10.sendibt1.com
    - cdn11.sendibt1.com
  selection_ip:
    DestinationIp:
    - 104.21.77.104
    - 188.114.97.3
  condition: selection_domain or selection_ip
falsepositives:
- Legitimate use of Brevo email services if the organization uses Brevo for marketing and the CDN infrastructure
  is not compromised
- CDN caching layers resolving to Cloudflare IPs (104.21.x.x) for legitimate traffic
level: high
