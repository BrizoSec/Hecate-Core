title: Suspicious C2 Communication via Compromised YouTube Channel Infrastructure
id: fdd99d39-45dc-40ba-8f73-28a974b7cff8
status: experimental
description: Detects network connections to known malicious domains associated with a multi-stage infostealer
  campaign leveraging compromised YouTube channels. The behavior includes connections to domains resembling
  legitimate services (e.g., 'config.hubdisplay.lol', 'metric.gardenpark.click') and blockchain-based
  C2 endpoints (e.g., 'polygon.iwmukj.xyz'), which are indicative of command-and-control infrastructure
  used to exfiltrate credentials and deploy cryptocurrency miners. These domains are linked to the resightloader.exe
  payload and exhibit patterns consistent with evasion and persistence.
