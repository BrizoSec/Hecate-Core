title: Suspicious DNS Queries from Compromised YouTube Delivery Chain
id: 2a778f02-d8f1-48f1-a606-bc2e8eadaf09
status: experimental
description: Detects DNS resolution attempts to known malicious domains associated with a multi-stage
  infostealer campaign distributed via compromised YouTube channels. The behavior involves querying domains
  linked to credential theft and blockchain-based C2 infrastructure, indicating potential malware communication
  or payload delivery. This rule focuses on full domain matches to avoid false positives from partial
  matches and aligns with the observed campaign's use of domain generation and dead drops.
