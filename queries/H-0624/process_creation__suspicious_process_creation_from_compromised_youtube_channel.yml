title: Suspicious Process Creation from Compromised YouTube Channel Distribution
id: 66d233a6-22aa-4775-8261-938f3187f27d
status: experimental
description: Detects execution of known malicious loaders (resightloader.exe) and associated components
  from suspicious domains linked to a credential theft and crypto-mining campaign. The behavior aligns
  with social engineering via compromised YouTube channels delivering multi-stage infostealers with sandbox
  evasion and blockchain-based C2, targeting high-value user credentials and financial assets.
references:
- https://www.elastic.co/security-labs/threat-command/revstealer-credential-harvesting-infostealer
author: hecate (auto-generated draft - requires analyst review)
date: '2026-10-04'
tags:
- attack.t1027
- attack.t1204.002
- attack.t1620
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    Image|endswith: resightloader.exe
    ParentImage|contains: chrome.exe
    CommandLine|contains:
    - elitecheatsx.live
    - resight-cheats.net
  filter:
    Image|contains: Windows\System32\
  condition: selection and not filter
falsepositives:
- Legitimate software updates using similar naming patterns
- User-initiated downloads from compromised sites with valid-looking domains
level: high
