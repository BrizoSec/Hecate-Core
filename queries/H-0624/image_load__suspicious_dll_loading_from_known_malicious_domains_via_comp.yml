hecate_review:
  verdict: revise
  issues:
  - The rule focuses on DLL loading from malicious domains via image_load events, but the source passages
    do not mention DLL loading from these domains as a behavior. Instead, the domains are identified as
    C2 servers, not sources of DLLs.
  - The rule references 'ImageLoaded|contains' with domain names, which is not a valid field in typical
    Windows logging (e.g., Sysmon) for domain names; this would require parsing network traffic or DNS
    logs, not image load events.
  - The rule assumes that resightloader.exe is loaded from memory by processes associated with compromised
    YouTube channels, but the source passages do not describe this specific memory loading behavior or
    link it to YouTube distribution in the detection logic.
  - The rule includes 'static4.livelab.one' as a C2 domain, but the passage only lists it as a domain
    with port 443, without confirming its role as a C2 server in the context of the campaign.
