title: Suspicious DLL loading from known malicious domains via compromised YouTube delivery chain
id: b87d920b-6a63-4478-a7b1-5d315f62f4e6
status: experimental
description: Detects execution of malicious payloads (resightloader.exe) loaded from memory by processes
  associated with compromised YouTube distribution channels, indicating a multi-stage infostealer campaign.
  The behavior aligns with T1620 (Social Engineering) and involves evasion techniques such as VMProtect
  packing and sandbox detection. This rule focuses on behavioral indicators—unusual DLL loading patterns
  from known malicious domains—rather than static file names, reducing false positives while maintaining
  detection efficacy.
references:
- https://www.elastic.co/security-labs/threat-command/revstealer-credential-harvesting-infostealer
author: hecate (auto-generated draft - requires analyst review)
date: '2026-10-04'
tags:
- attack.t1620
logsource:
  category: image_load
  product: windows
detection:
  selection:
    Image|endswith: \resightloader.exe
    ImageLoaded|contains:
    - polygon.mnyhgxda.xyz
    - monitor5.roast-core85.click
    - metric.gardenpark.click
    - config.hubdisplay.lol
    - health.journal-metric.lol
    - polygon.iwmukj.xyz
    - static4.livelab.one
  filter:
    Image|endswith: \explorer.exe
  condition: selection and not filter
falsepositives:
- Legitimate software using embedded resources from third-party domains
- Development environments with custom DNS resolution
level: medium
