title: Detection of Malicious NVIDIA Executable
id: c784ee8e-3f84-411d-bc55-ea514fe36bf6
status: experimental
description: Detects the execution of a malicious executable disguised as an NVIDIA file, which is indicative
  of initial foothold and persistence establishment on Windows systems.
references:
- https://blackpointcyber.com/blog/threat-snapshot-labubarat/
author: hecate (auto-generated draft - requires analyst review)
date: '2026-09-23'
tags:
- attack.t1027.004
