logsource:
  category: file_event
  product: windows
detection:
  selection:
    TargetFilename|endswith: .nvidia.exe
  filter:
    Image|contains: C:\Program Files\NVIDIA Corporation\NVDisplayDriver
  condition: selection and not filter
falsepositives:
