description: Detects the file system activity associated with the FamousSparrow APT group's SparroWocky
  backdoor. The malware employs a Trident loader technique that abuses DLL side-loading (T1574.001) by
  searching for legitimate localization files (.mui) in C:\Windows\System32\en-US\. This behavior is distinct
  from normal system operation as it involves scanning this specific directory structure, likely to identify
  a target DLL to replace or load maliciously.
