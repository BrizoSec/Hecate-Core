title: SparroWocky Trident Loader DLL Side-Loading via System32 Subdirectory
id: f69d00ee-ad3b-4bf0-b051-66f0727d9800
status: experimental
description: Detects the SparroWocky backdoor's use of a 'Trident loader' to hijack legitimate process
  execution. The malware places a malicious DLL in C:\Windows\System32\ (or a subdirectory) and relies
  on the system loading it instead of the expected legitimate DLL, or loads a specific MUI file from C:\Windows\System32\en-US\
  as part of the side-loading chain. This rule targets the image_load event where a DLL is loaded from
  the System32 directory but is not signed by Microsoft, indicating potential side-loading or replacement.
references:
- https://www.welivesecurity.com/en/eset-research/beware-sparrowock-backdoor-bites-commands-catch/
author: hecate (auto-generated draft - requires analyst review)
date: '2026-10-11'
tags:
- attack.t1574.001
logsource:
  category: image_load
  product: windows
detection:
  selection_malicious_dll:
    ImageLoaded|endswith: .dll
    Image|startswith: C:\Windows\System32\
  filter_legitimate_signed:
    Signed: Microsoft Windows
  condition: selection_malicious_dll and not filter_legitimate_signed
falsepositives:
- Legitimate software that installs custom DLLs in System32 (rare but possible)
- Windows updates or patches that may temporarily load unsigned components during installation
- Enterprise applications with custom system-level components
level: high
hunt_id: H-0697
hecate_review:
  verdict: revise
  issues:
  - The rule title and description explicitly mention 'Trident loader', but the provided source passages
    do not contain any reference to 'Trident'. The hypothesis mentions it, but the constraint requires
    judging against the source passages.
  - The rule claims the malware places a malicious DLL in System32. Passage [1] states the configuration
    is extracted from 'payload.dat', and Passage [15]/[18] lists 'winfsp-x64.dll' as a hash/identifier,
    but there is no passage stating SparroWocky *places* or *installs* a DLL in System32. It may load
    it, but the rule's premise of 'placing' is unsupported by the text.
  - 'The rule filters for `Signed: Microsoft Windows`. Passage [15] and [18] list hashes for ''winfsp-x64.dll'',
    implying this specific DLL is involved in the side-loading or loading chain. The rule does not account
    for the specific DLL name mentioned in the passages, relying instead on a generic signature filter
    which might miss the specific artifact described.'
  unverified_contradiction: The rule asserts the use of a 'Trident loader' and that the malware 'places'
    a malicious DLL in System32. The source passages do not mention 'Trident' at all, nor do they state
    that SparroWocky places a DLL in System32; they only mention extracting configuration from payload.dat
    and list winfsp-x64.dll hashes.
