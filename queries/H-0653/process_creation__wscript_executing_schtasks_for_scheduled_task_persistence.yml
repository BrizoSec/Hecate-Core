title: WScript Executing SchTasks for Scheduled Task Persistence
id: 0cdb67b3-23c8-41c7-b226-3e14ffcaa16a
status: experimental
description: 'Detects wscript.exe executing schtasks.exe with the /create argument. This behavior aligns
  with T1059.007 (Windows Script Host) and T1053.005 (Scheduled Task/Job: Scheduled Task). Adversaries
  may use WScript to obfuscate command-line arguments when creating scheduled tasks for persistence.'
references: []
author: hecate (auto-generated draft - requires analyst review)
