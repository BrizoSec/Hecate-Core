title: DLL Sideloading in Visual Studio Build Processes via AppDomainManager
id: ffcd05bf-0128-4cdf-888b-6796782b4a1e
status: experimental
description: Detects DLL sideloading events where a legitimate .NET assembly, typically loaded from a
  non-standard directory, is signed but loaded outside of C:\Windows\System32\. This behavior is consistent
  with adversaries hijacking AppDomainManager within Visual Studio build processes (devenv.exe or msbuild.exe)
  to load malicious payloads, such as ShelbyLoader V2, while bypassing standard endpoint detection by
  leveraging trusted signatures.
references:
- https://unit42.paloaltonetworks.com/blinder-tunnel-targets-critical-infrastructure/
author: hecate (auto-generated draft - requires analyst review)
date: '2026-10-10'
tags:
- attack.t1574.001
- attack.t1574.014
logsource:
  category: image_load
  product: windows
detection:
  selection_sideloading:
    ImageLoaded|endswith: .dll
    Image|startswith: C:\
    Signed: 'true'
  filter_legitimate_system32:
    Image|contains: \Windows\System32\
  condition: selection_sideloading and not filter_legitimate_system32
falsepositives:
- Legitimate applications installing components to local AppData or Program Files directories
- Visual Studio extensions loading dependencies from user profile paths
- Software update mechanisms placing DLLs in temporary build folders
level: high
hunt_id: H-0686
hecate_review:
  verdict: keep
