title: Outbound Connection to Blockchain API Endpoints via Non-Browser Processes
id: c44ee995-c90c-46e9-9004-74e0dbd58907
status: experimental
description: Detects outbound HTTPS connections to public blockchain explorers (e.g., etherscan.io) or
  TON APIs from non-browser processes. This behavior aligns with the threat hypothesis of adversaries
  using blockchain-based C2 resolution via Ethereum and TON APIs to maintain persistent access, bypassing
  traditional DNS-based detection.
references:
- https://cofense.com/blog/from-guest-complaints-to-malware-blockchain-abuse-targets-hotels
author: hecate (auto-generated draft - requires analyst review)
date: '2026-10-15'
tags:
- attack.t1566
logsource:
  category: network_connection
  product: windows
detection:
  selection_blockchain_api:
    DestinationHostname|contains: etherscan.io
    DestinationPort: 443
  selection_non_browser:
    Image|endswith: \cmd.exe
  selection_powershell:
    Image|endswith: \powershell.exe
  condition: selection_blockchain_api and (selection_non_browser or selection_powershell)
falsepositives:
- Legitimate blockchain development or trading tools running from command line
- Administrative scripts querying public blockchain data for monitoring purposes
level: high
hunt_id: H-0773
hecate_review:
  verdict: revise
  issues:
  - The rule relies on detecting connections to 'etherscan.io', but the source passages describe adversaries
    using public blockchain APIs for C2 resolution, not necessarily interacting with the Etherscan explorer
    interface. The specific TON smart contract address is provided as an indicator, but the rule does
    not account for TON API endpoints.
  - The rule limits detection to `cmd.exe` and `powershell.exe`. The source passages explicitly state
    that malicious LNK shortcut files are delivered and deployed malware families (EtherRAT and TONResolver).
    These are typically executed by `explorer.exe` or the system loader, not necessarily via command-line
    interpreters. Restricting the scope to CLI processes misses the primary execution vector described.
  - The rule assumes 'non-browser processes' is a sufficient filter, but blockchain C2 often mimics legitimate
    web traffic patterns. The hypothesis mentions 'persistent access', which implies long-term C2, but
    the rule only detects the initial connection event without correlating it to the specific malware
    families or indicators mentioned.
  unverified_contradiction: The rule restricts detection to cmd.exe and powershell.exe, whereas the report
    describes LNK payloads deploying malware (EtherRAT/TONResolver), which typically execute via standard
    Windows shell processes (like explorer.exe) rather than explicit command-line invocations in this
    context.
