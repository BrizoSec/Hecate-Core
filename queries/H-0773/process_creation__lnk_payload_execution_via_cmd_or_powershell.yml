title: LNK Payload Execution via cmd or PowerShell
id: 7c4a6f6b-674e-469c-bda3-9e162907fa00
status: experimental
description: Detects the execution of LNK files (shortcuts) directly by command interpreters such as cmd.exe
  or powershell.exe. This behavior is consistent with the initial delivery vector described in the hunt
  hypothesis, where malicious LNK shortcuts disguised as image files are executed to establish persistence
  or trigger subsequent malware families like EtherRAT or TONResolver.
references:
- https://cofense.com/blog/from-guest-complaints-to-malware-blockchain-abuse-targets-hotels
author: hecate (auto-generated draft - requires analyst review)
date: '2026-10-15'
tags:
- attack.t1204.004
logsource:
  category: process_creation
  product: windows
detection:
  selection_cmd:
    Image|endswith: \cmd.exe
    CommandLine|contains: .lnk
  selection_ps:
    Image|endswith: \powershell.exe
    CommandLine|contains: .lnk
  condition: selection_cmd or selection_ps
falsepositives:
- Legitimate administrative scripts executing shortcuts for automation
- User double-clicking shortcuts that may be logged in parent process command lines depending on logging
  configuration
- Installers or deployment tools using shortcuts
level: medium
hunt_id: H-0773
hecate_review:
  verdict: keep
