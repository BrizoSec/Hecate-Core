title: DNS Query to Known Blockchain C2 Infrastructure Domains
id: 4f331c1c-d491-48a2-b55f-49893e7e4e5b
status: experimental
description: Detects DNS queries for domains explicitly identified in threat intelligence as part of the
  EtherRAT/TONResolver campaign targeting the accommodation industry. These domains are used by malware
  to resolve Command and Control infrastructure via blockchain APIs, bypassing traditional domain takedowns.
  This rule specifically hunts for the resolution phase of this C2 channel.
