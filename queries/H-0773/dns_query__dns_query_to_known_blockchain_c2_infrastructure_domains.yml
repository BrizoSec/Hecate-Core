  condition: selection
falsepositives:
- Legitimate use of Cloudflare Tunnel (trycloudflare.com) for development or testing
- Azure DNS resolution for legitimate cloud services in South Africa North or Norway East regions
- User browsing to compromised or typosquatted domains
level: high
