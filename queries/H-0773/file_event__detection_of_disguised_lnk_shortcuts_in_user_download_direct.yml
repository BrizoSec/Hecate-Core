title: Detection of Disguised LNK Shortcuts in User Download Directories
id: 93fef60e-74ae-40bb-bd4f-ce37d3dd1845
status: experimental
description: Detects the creation of Windows Shortcut files (.lnk) with double extensions mimicking image
  files (e.g., .jpg.lnk) in user download directories. This behavior aligns with the initial delivery
  mechanism of the EtherRAT/TONResolver campaign, where malicious LNK payloads are disguised as benign
  media files to trick hotel staff into execution.
references:
- https://cofense.com/blog/from-guest-complaints-to-malware-blockchain-abuse-targets-hotels
author: hecate (auto-generated draft - requires analyst review)
date: '2026-10-15'
tags:
- attack.t1036
- attack.t1566
logsource:
  category: file_event
  product: windows
detection:
  selection_lnk:
    TargetFilename|endswith: .lnk
  selection_disguise:
    TargetFilename|contains: .jpg.lnk
  condition: selection_lnk and selection_disguise
falsepositives:
- Legitimate software installers or documentation that may use .lnk files
- User-created shortcuts for media files
level: high
hunt_id: H-0773
hecate_review:
  verdict: keep
