title: Outbound Connection to Malicious Action1 RMM Update Infrastructure
id: 5899de3c-eb2d-4622-bb5c-0933ad4b16a7
status: experimental
description: Detects outbound network connections to specific Vercel-hosted domains identified in SANS
  ISC threat intelligence as part of a campaign abusing the legitimate Action1 RMM tool. Adversaries use
  phishing to deliver MSI installers that drop action1_agent.exe and establish persistence via the 'A1Agent'
  service. This rule targets the malicious update or C2 infrastructure associated with this abuse, distinct
  from legitimate Action1 servers.
