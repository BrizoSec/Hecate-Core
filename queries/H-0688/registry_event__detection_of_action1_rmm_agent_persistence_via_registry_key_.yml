title: Detection of Action1 RMM Agent Persistence via Registry Key Creation
id: 72979fb3-ef2b-4363-9e25-002fec2adaf8
status: experimental
description: Detects the creation of the Action1 Agent registry key, which is used for persistence and
  configuration by the Action1 Remote Monitoring and Management tool. Adversaries abusing this legitimate
  tool may create this key to establish persistence on compromised Windows systems.
references:
- https://isc.sans.edu/diary/rss/33400
author: hecate (auto-generated draft - requires analyst review)
date: '2026-10-10'
tags:
- attack.t1543.003
logsource:
  category: registry_event
  product: windows
detection:
  selection:
    TargetObject|contains: HKLM\Software\Action1\Agent
  condition: selection
falsepositives:
- Legitimate installation of Action1 RMM agent by IT administrators
- Automated patch management or endpoint protection software that utilizes similar registry structures
level: medium
hunt_id: H-0688
hecate_review:
  verdict: keep
