title: Execution of Action1 RMM Agent from Suspicious Path
id: cd4c5dfb-fd59-4f58-960c-c590d34ccbc8
status: experimental
description: Detects the execution of the Action1 remote monitoring and management (RMM) agent binary.
  While Action1 is legitimate software, this rule targets its specific installation path and binary name
  which are being abused in current threat campaigns to establish persistence and unauthorized remote
  access. Adversaries often drop this binary via phishing MSI installers.
