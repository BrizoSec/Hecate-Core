title: Detection of AI-Generated Malicious Python Scripts and C2 Payloads via File Write
id: a0ef0a6e-3b5d-4a36-9974-f314b4f12bf1
status: experimental
description: This rule detects the creation of AI-generated Python scripts (e.g., exploit_creative.py,
  exploit_careful.py) and known C2 payloads (socktz_v9.exe, NextChat.exe, SockTz.exe) on disk, which are
  indicative of adversarial activity leveraging AI to automate exploitation and establish persistence.
  The behavior aligns with T1566.001 (Phishing) and T1059.003 (Command and Scripting Interpreter), particularly
  in the context of targeted attacks against Latin American government and financial sectors. The rule
  prioritizes behavioral patterns over static indicators to reduce false positives while maintaining detection
  fidelity.
references:
- https://unit42.paloaltonetworks.com/ai-tool-use-targeting-latam-orgs/
author: hecate (auto-generated draft - requires analyst review)
date: '2026-10-03'
tags:
- attack.t1566.001
logsource:
  category: file_event
  product: windows
detection:
  selection:
    TargetFilename|endswith: SockTz.exe
  filter:
    TargetFilename|endswith: SockTz.exe
    Image|contains: python
  condition: selection and not filter
falsepositives:
- Legitimate development scripts with similar names
- Security researchers testing AI-generated payloads
- Automated build processes using similar filenames
level: medium
hunt_id: H-0619
hecate_review:
  verdict: revise
  issues:
  - The rule focuses on file writes of specific executables (e.g., SockTz.exe) but the source passages
    do not indicate that these files are written to disk during the attack; instead, they describe retrieval
    from remote servers (e.g., hxxp[:]//167.148.195[.]53:8888/socktz_v9.exe). The rule misrepresents the
    behavior as local file creation when the evidence suggests remote delivery.
  - The rule claims to detect AI-generated Python scripts, but the source passages do not mention any
    AI-generated Python scripts being written to disk. The only mention of AI is in the context of enhancing
    workflows, not generating specific scripts like exploit_creative.py.
  - The rule includes 'NextChat.exe' as a known C2 payload, but the source passage [7] only states that
    the IP 178.128.87.160 hosted NextChat on port 3000, not that the executable was written to disk or
    delivered as a file named NextChat.exe.
