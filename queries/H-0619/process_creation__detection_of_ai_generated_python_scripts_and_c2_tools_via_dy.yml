title: Detection of AI-Generated Python Scripts and C2 Tools via Dynamic DNS Domains
id: 34c54fe3-bc25-46e8-9873-e26905560a8b
status: experimental
description: This rule detects the execution of AI-generated Python scripts (e.g., exploit_creative.py,
  exploit_careful.py) and known C2 tools (SockTz.exe, NextChat.exe) that are commonly associated with
  adversarial infrastructure hosted on dynamic DNS domains such as duckdns.org. The behavior indicates
  potential automated exploitation and command-and-control communication, consistent with threat actors
  leveraging AI to generate malicious payloads and maintain persistence in targeted Latin American organizations.
  The rule prioritizes behavioral patterns over static indicators to reduce false positives while maintaining
  detection efficacy.
references:
- https://unit42.paloaltonetworks.com/ai-tool-use-targeting-latam-orgs/
author: hecate (auto-generated draft - requires analyst review)
date: '2026-10-03'
tags:
- attack.t1190
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    CommandLine|contains: socktz_v8.exe
    Image|endswith: \NextChat.exe
  filter:
    Image|endswith: \cscript.exe
  condition: selection and not filter
falsepositives:
- Administrative scripting using Python for legitimate automation
- Security researchers testing known C2 tools in isolated environments
level: medium
hunt_id: H-0619
hecate_review:
  verdict: revise
  issues:
  - The rule focuses on specific file names like 'socktz_v8.exe' and 'NextChat.exe', but the source passages
    do not confirm that these exact files were executed in the context of AI-generated Python scripts
    or dynamic DNS C2 infrastructure. The rule assumes a direct link between these files and AI-generated
    Python scripts, which is not explicitly supported by the source.
  - The rule mentions 'AI-generated Python scripts' (e.g., exploit_creative.py, exploit_careful.py) but
    the source passages do not mention any such scripts or their execution. The only reference to AI is
    in passage [10], which states that actors use commercial LLMs in their workflows, not that they generate
    Python scripts directly.
  - The rule links the execution of SockTz and NextChat to dynamic DNS domains, but the source passages
    do not confirm that these tools were executed via duckdns.org or similar domains. The domain m-doxa-apodo.duckdns.org
    is mentioned in passage [1], but no direct link is made between it and the execution of SockTz or
    NextChat.
  - The rule's detection logic is overly narrow, relying on specific file names and command lines that
    may not be present in the actual attack chain described.
