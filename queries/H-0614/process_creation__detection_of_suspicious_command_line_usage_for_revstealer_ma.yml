title: Detection of Suspicious Command Line Usage for REVSTEALER Malware
id: 1d9a64b9-63e4-4214-8a93-9c36624612f3
status: experimental
description: This rule aims to detect suspicious command line activities that may indicate the execution
  of REVSTEALER malware, which is often distributed via phishing or malvertising. The focus is on identifying
  unusual behavior such as downloading files from known malicious domains.
references:
- https://www.elastic.co/security-labs/threat-command/revstealer-credential-harvesting-infostealer
author: hecate (auto-generated draft - requires analyst review)
date: '2026-09-07'
tags:
- attack.t1542.003
logsource:
  category: process_creation
detection:
  selection:
    Image|endswith: \powershell.exe
    CommandLine|contains: -ExecutionPolicy Bypass -WindowStyle Hidden -EncodedCommand
  filter:
    CommandLine|contains: known-good-domain.com
  condition: selection and not filter
falsepositives:
- Administrative use of PowerShell for automated tasks
level: medium
related:
- id: H-0614
  type: derived
