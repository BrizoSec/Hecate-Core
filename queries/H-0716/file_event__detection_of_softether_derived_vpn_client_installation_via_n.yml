description: Detects the installation of the HangroVPN or similar SoftEther-derived VPN client by monitoring
  for the creation of its specific network adapter driver file. This tool is used by DPRK entities to
  establish resilient C2 channels that bypass standard TLS inspection due to self-signed certificates.
  The presence of the 'NeoAdapter_VPN' driver indicates the deployment of this specific infrastructure.
