title: DPRK Hangro VPN Client Authentication to Known Infrastructure
id: d3eadb19-6526-4037-86e1-9b725b0f39d8
status: experimental
description: Detects authentication events associated with the Hangro VPN client (SoftEther-derived) connecting
  to known North Korean trade representative infrastructure. This tool is used for resilient C2 and mail
  relay channels, often bypassing standard TLS inspection via self-signed certificates. Detection focuses
  on the specific IP addresses associated with this threat actor's infrastructure.
references:
- https://blog.synapticsystems.de/north-koreas-hangro-revisited
author: hecate (auto-generated draft - requires analyst review)
date: '2026-10-12'
tags:
- attack.t1110
logsource:
  category: authentication
  product: windows
detection:
  selection_ip:
    IpAddress|cidr:
    - 175.45.176.0/24
    - 175.45.178.0/24
    - 175.45.177.0/24
    - 188.43.136.0/24
  condition: selection_ip
falsepositives:
- Legitimate business communications with North Korean entities (if any exist in the environment)
- Proxy or VPN services using similar IP ranges
- DNS resolution of legitimate domains if WorkstationName captures DNS queries
level: high
hunt_id: H-0716
hecate_review:
  verdict: revise
  issues:
  - 'The rule specifies `logsource: category: authentication`, but the source passages describe network
    infrastructure, certificate hierarchies, IP addresses, and mail relay capabilities. There is no mention
    of Windows authentication logs or events being the primary indicator.'
  - The rule detects 'authentication events', whereas the hypothesis and passages focus on 'cryptographically
    anomalous' connections, self-signed certificates, and specific IP ranges associated with VPN/mail
    infrastructure, not user authentication logs.
  - The detection logic relies solely on IP addresses (`selection_ip`), which aligns with the network
    indicators in the text, but the log source mismatch makes the rule ineffective for its stated purpose.
  unverified_contradiction: The rule claims to detect 'authentication events' in 'windows' logs, but the
    provided text describes a VPN client connecting to infrastructure via specific IPs and certificates,
    with no mention of Windows authentication mechanisms.
