title: Suspicious Java Execution with Copilot Binary Name on PaperCut Server
id: 510ab401-81fb-49ea-a5a0-f43b6fdbb3da
status: experimental
description: Detects the execution of java.exe or javaw.exe using a command line containing 'jakarta.java',
  'stage2_javax.java', or 'mscopilot.exe'. This targets the in-memory Java loader TTP used to establish
  persistence and deliver C2 implants on PaperCut MF servers, bypassing standard AV by leveraging legitimate
  binaries with suspicious names.
