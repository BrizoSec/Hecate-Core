detection:
  selection_msiexec:
    Image|endswith: \msiexec.exe
    CommandLine|contains: /i
  selection_parent:
    ParentImage|endswith: \explorer.exe
  selection_indicator:
    CommandLine|contains:
    - 107.175.82.242
    - 193.178.159.128
  condition: selection_msiexec and selection_parent and (selection_indicator)
falsepositives:
