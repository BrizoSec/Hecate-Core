title: Execution of msiexec via Run Dialog with Malicious Payload URL
id: d2a0388f-1cca-4e16-9e87-f5c6bd6a63ba
status: experimental
description: Detects the execution of msiexec.exe triggered by a user pasting a command into the Windows
  Run dialog (parented by explorer.exe) to download and install a payload from a known malicious domain
  or IP associated with the Psychedelic infostealer campaign. This behavior is indicative of a ClickFix
  social engineering attack.
references:
- https://arcticwolf.com/resources/blog/psychedelic-stealer-fake-clickfix-captcha-targets-ukraine/
author: hecate (auto-generated draft - requires analyst review)
