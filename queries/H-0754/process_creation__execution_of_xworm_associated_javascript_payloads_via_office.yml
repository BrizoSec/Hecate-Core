title: Execution of XWorm-associated JavaScript Payloads via Office Hosts
id: 8b96adca-0d3d-4021-8d84-4b3578ecc7f5
status: experimental
description: Detects the execution of specific malicious JavaScript files associated with the XWorm malware
  delivery campaign. These payloads are typically delivered via phishing emails and executed through legitimate
  Office applications (e.g., winword.exe, excel.exe) to establish initial access and credential theft
  capabilities.
references:
- https://cyberint.com/blog/dark-web/xworm-malware-worming-its-way-from-entry-to-exploitation/
author: hecate (auto-generated draft - requires analyst review)
date: '2026-10-14'
tags:
- attack.t1059.007
logsource:
  category: process_creation
  product: windows
detection:
  selection_js:
    CommandLine|contains: .JS
  selection_names:
    Image|endswith: \winword.exe
    CommandLine|contains:
    - doc21092026.JS
    - QPO# 48123 Rev.JS
    - SHIPPING REQ LN 03 AWL.JS
    - REQ2650PF064.JS
  condition: selection_js and selection_names
falsepositives:
- Legitimate macro-enabled documents or scripts executed by Office applications for business purposes.
level: high
hunt_id: H-0754
hecate_review:
  verdict: keep
