title: Suspicious NTP-shaped DNS queries from Magento server
id: b1c437bd-4b67-4f7e-8d50-e65b58cf2fb0
status: experimental
description: Detects DNS queries to domains and IPs associated with the Magento/Adobe Commerce RCE campaign,
  specifically those mimicking NTP traffic on port 123. These queries are indicative of C2 communication
  using NTP-shaped traffic, a known evasion technique in the campaign. The rule focuses on behavioral
  patterns rather than isolated indicators to reduce false positives while maintaining detection coverage.
