title: Suspicious PHP Code Injection in Magento Product Image Cache
id: a1fdbb73-962b-4372-a9ca-ffeb110c1c91
status: experimental
description: Detects attempted exploitation of a zero-day RCE vulnerability in Magento/Adobe Commerce
  by writing malicious PHP files to the product image cache directory, a known indicator of initial compromise
  via GraphQL-based code injection. The pattern of file creation in the cache path with specific naming
  conventions aligns with the reported attack chain and indicates potential unauthenticated remote code
  execution.
references:
- https://sansec.io/research/stylesmuggler
author: hecate (auto-generated draft - requires analyst review)
date: '2026-10-05'
tags:
- attack.t1053.003
- attack.t1105
logsource:
  category: file_event
detection:
  selection:
    TargetFilename|startswith: pub/media/catalog/product/cache/ss_
    TargetFilename|endswith: .php
  filter:
    TargetFilename|contains: defunct
  condition: selection and not filter
falsepositives:
- Legitimate cache cleanup scripts or automated image processing tools that generate temporary PHP files
  in the cache directory
- Misconfigured third-party modules that write temporary files with similar naming patterns
level: high
hunt_id: H-0627
hecate_review:
  verdict: revise
  issues:
  - The rule does not account for the specific file naming pattern described in passage [8], which includes
    a dynamic 10-hex value and the exact structure 'ss_<10hex>/sync_<10hex>.php'. The current rule only
    checks for 'ss_' prefix and '.php' suffix, which is too broad and may miss the actual malicious file
    or generate false positives.
  - The rule fails to detect the use of the 'defunct' directory and the related file 'defunct.dat' mentioned
    in passages [9] and [10], which are part of the attack chain and could be used to correlate behavior.
  - The rule does not capture the process masquerading behavior described in passages [14] and [15], where
    the implant disguises itself as 'chronyd', 'sshd', 'apache@notty', '-bash', and '[kworker/u16:2]',
    which is a key persistence and evasion technique.
  - The rule does not detect the NTP-shaped C2 traffic described in passages [4] and [2], which involves
    UDP packets to port 123 with specific timing and payload size (48 bytes), a critical part of the hypothesis.
  - The rule does not include any detection for the initial beacon to the oast.site domain (passage [7])
    or the C2 communication to 213.111.146.27 (passage [3]), which are essential indicators of the full
    attack lifecycle.
