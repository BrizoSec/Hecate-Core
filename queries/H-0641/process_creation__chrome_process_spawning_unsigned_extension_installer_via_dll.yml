title: Chrome Process Spawning Unsigned Extension Installer via DLL Sideloading
id: abeaf58b-7a49-457a-8c15-b899846d7854
status: experimental
description: Detects a Chromium-based browser process (e.g., chrome.exe) spawning a child process that
  loads a legitimate DLL from a non-standard location, indicating potential DLL sideloading used to install
  malicious extensions silently. This TTP is associated with the KREMLIN threat actor targeting Brazilian
  banks to steal session cookies and bypass MFA.
references:
- https://www.elastic.co/security-labs/threat-command/malicious-browser-extension-kremlin-banking-malware
author: hecate (auto-generated draft - requires analyst review)
date: '2026-10-06'
tags:
- attack.t1176.001
logsource:
  category: process_creation
  product: windows
detection:
  selection_chrome:
    Image|endswith: \chrome.exe
  selection_sideloading:
    ParentImage|endswith: \chrome.exe
    CommandLine|contains: -extension-process
  condition: selection_chrome and selection_sideloading
falsepositives:
- Legitimate browser extensions installed via official store or enterprise policy
- Browser updates or crash recovery processes
- Automated testing tools using Chrome headless mode
level: high
hunt_id: H-0641
hecate_review:
  verdict: revise
  issues:
  - The source passages list is empty, preventing validation against specific evidence.
  - The rule detects DLL sideloading via process spawning, while the hypothesis specifies 'forged Chrome
    integrity checks'. These are distinct TTPs; forged integrity checks typically involve memory patching
    or binary modification to bypass verification, not necessarily spawning a child installer process.
