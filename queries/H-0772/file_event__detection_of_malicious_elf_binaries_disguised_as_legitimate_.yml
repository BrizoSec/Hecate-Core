title: Detection of Malicious ELF Binaries Disguised as Legitimate Libraries on Linux
id: 409ac760-7649-4300-9552-871654971de9
status: experimental
description: Detects the creation of files with filenames commonly used by the PoeLLM campaign to disguise
  malicious ELF binaries (miners) as legitimate system libraries. This targets the specific file drop
  tradecraft where 'libgcrypt' is used as a decoy name for executable payloads, leveraging the legitimacy
  of standard library names to evade detection.
references:
- https://www.lumen.com/blog/en-us/canto-incognito-tracking-the-poellm-malware
author: hecate (auto-generated draft - requires analyst review)
