    Image|endswith: \rundll32.exe
    CommandLine|contains: /sta {CFDC57BA-1705-45AF-BA10-EFC3D592982B}
  condition: selection
falsepositives:
- Legitimate VB6 applications using standard COM interfaces
- System utilities invoking DLL functions via rundll32
