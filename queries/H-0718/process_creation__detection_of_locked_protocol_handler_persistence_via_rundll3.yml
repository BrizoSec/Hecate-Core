title: Detection of Locked Protocol Handler Persistence via Rundll32
id: dea66183-8065-4145-afee-c7e746ef58b1
status: experimental
description: Detects the execution of rundll32.exe with a specific CLSID argument, which is indicative
  of the DarkMe RAT variant abusing a custom 'Locked://' protocol handler for persistence. This behavior
  loads Coconout.dll and may be associated with process hollowing techniques used to maintain access.
references:
- https://www.huntress.com/blog/darkme-rat-abandons-exploits
author: hecate (auto-generated draft - requires analyst review)
