title: DarkMe RAT C2 Communication via Locked Protocol Handler Delivery
id: c17e0507-7fbe-4252-85cd-fdc0c57ec40a
status: experimental
description: Detects network connections to domains associated with the DarkMe RAT delivery infrastructure.
  The threat actor uses social engineering to deliver disguised files that establish a custom 'Locked://'
  protocol handler and Run Key persistence. This rule identifies the initial network contact to staging
  domains used to distribute the malicious payload.
