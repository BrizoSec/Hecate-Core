title: Detection of Citrix NetScaler Webshell and Alias Configuration Persistence
id: dd58855e-1452-43b6-a710-879324c7bf9c
status: experimental
description: Detects file modifications associated with the persistence mechanism for the Citrix NetScaler
  Gateway exploitation campaign (CVE-2025-5777, CVE-2026-88771). This includes the creation of the hidden
  PHP webshell (.ctxs.receiver) and the disguised CSS files used to route traffic to it via Apache/Nginx
  Alias/AliasMatch rules.
references:
- https://www.greynoise.io/blog/swarming-against-citrix-0-day-exploitation
author: hecate (auto-generated draft - requires analyst review)
date: '2026-10-13'
tags:
- attack.t1036
logsource:
  category: file_event
detection:
  selection_webshell:
    TargetFilename|endswith: /var/netscaler/logon/LogonPoint/custom/.ctxs.receiver
  selection_css_alias:
    TargetFilename|contains: receiver.min.css
  condition: selection_webshell or selection_css_alias
falsepositives:
- Legitimate NetScaler customizations
- Standard CSS minification processes during updates
level: high
hunt_id: H-0745
hecate_review:
  verdict: keep
