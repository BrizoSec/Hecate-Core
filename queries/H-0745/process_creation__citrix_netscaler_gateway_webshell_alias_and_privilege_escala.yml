title: Citrix NetScaler Gateway Webshell Alias and Privilege Escalation via /bin/sh
id: 9345c608-fae4-4e15-8e3f-aef791189f2b
status: experimental
description: Detects the execution of commands associated with configuring Apache/Nginx aliases to route
  CSS requests to a hidden PHP webshell (.ctxs_receiver) and attempts to escalate privileges by setting
  setuid/setgid bits on /bin/sh. This behavior is indicative of post-exploitation persistence and privilege
  escalation on Citrix NetScaler Gateway appliances.
references:
- https://www.greynoise.io/blog/swarming-against-citrix-0-day-exploitation
author: hecate (auto-generated draft - requires analyst review)
date: '2026-10-13'
tags:
- attack.t1036
- attack.t1059.004
- attack.t1190
logsource:
  category: process_creation
detection:
  selection_webshell_alias:
    CommandLine|contains: /var/netscaler/logon/LogonPoint/custom/.ctxs.receiver
  selection_css_alias:
    CommandLine|re: receiver\.min\.[0-9a-f]+\.css
  selection_priv_escalation:
    CommandLine|contains: receiver.min.css
    Image|endswith: /bin/sh
  condition: 1 of selection_*
falsepositives:
- Legitimate NetScaler administrative configuration scripts
- Custom CSS deployment tools using similar naming conventions
level: high
hunt_id: H-0745
hecate_review:
  verdict: keep
