hecate_review:
  verdict: revise
  issues:
  - The rule restricts detection to DestinationPort 80, but the source passages explicitly state that
    the scanner component communicates with C2 on port 31337 (Passage [24], [25]) and the webshell infrastructure
    uses port 31338 (Passage [3]). By hardcoding port 80, the rule fails to detect the full scope of the
    described C2 activity.
  - The rule title mentions 'Blue Mockingbird', but the specific campaign details in the passages describe
    a Rust-based scanner and Godzilla webshell. While Blue Mockingbird is mentioned as an attribution
    tag in Passage [4], the specific IPs listed are associated with the current campaign's infrastructure,
    not necessarily exclusively Blue Mockingbird's historical C2. However, the primary issue is the port
    restriction.
  unverified_contradiction: 'The rule specifies DestinationPort: 80, but the passages indicate other ports
    are used for C2.'
