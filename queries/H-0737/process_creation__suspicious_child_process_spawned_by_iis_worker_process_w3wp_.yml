title: Suspicious Child Process Spawned by IIS Worker Process w3wp.exe
id: 7f82e126-2642-46e1-ad09-14aac8e1e0fd
status: experimental
description: Detects the execution of command-line interpreters (cmd.exe, powershell.exe) spawned by the
  IIS worker process (w3wp.exe). This behavior is highly suspicious as it indicates potential remote code
  execution via vulnerabilities like CVE-2019-18935, allowing adversaries to establish persistence or
  lateral movement within the web server context.
references:
- https://asec.ahnlab.com/ko/95560/
author: hecate (auto-generated draft - requires analyst review)
date: '2026-10-13'
tags:
- attack.t1059.001
- attack.t1059.003
logsource:
  category: process_creation
  product: windows
detection:
  selection_w3wp_cmd:
    ParentImage|endswith: \w3wp.exe
    Image|endswith: \cmd.exe
  selection_w3wp_ps:
    ParentImage|endswith: \w3wp.exe
    Image|endswith: \powershell.exe
  condition: selection_w3wp_cmd or selection_w3wp_ps
falsepositives:
- Legitimate IIS administration scripts
- Automated deployment tools interacting with IIS
- Web application health checks invoking system utilities
level: high
hunt_id: H-0737
hecate_review:
  verdict: keep
