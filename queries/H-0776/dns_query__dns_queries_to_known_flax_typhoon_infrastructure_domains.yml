detection:
  selection:
    QueryName|contains:
    - 98aicai.com
    - youtubecard.com
    - c0cc.cc
    - 98aicode.com
    - outlook3650.com
    - linkedinns.net
  condition: selection
falsepositives:
- Legitimate email or social media services using similar domain names
- CDN or proxy services resolving to these domains
- User browsing errors or typos leading to these domains
level: high
