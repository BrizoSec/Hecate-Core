title: DNS Queries to Known Flax Typhoon Infrastructure Domains
id: 119eca82-3b34-411e-b54a-2760b2461f5f
status: experimental
description: Detects DNS queries to domains associated with the Flax Typhoon threat group, specifically
  those used for network enumeration and password spraying precursors against Microsoft Exchange servers.
  This behavior indicates potential reconnaissance or credential harvesting activities targeting critical
  infrastructure.
references:
- https://www.theregister.com/security/2026/10/08/us-disrupts-chinese-hacking-tools-as-7-govts-warn-of-prc-spies-stealing-sensitive-data-worldwide/5302107
