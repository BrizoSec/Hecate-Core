title: Network Connection to Flax Typhoon Associated Domains
id: bd4a3261-dce4-4a07-b064-76d38cdc2fd3
status: experimental
description: Detects outbound network connections to domains associated with the Flax Typhoon threat group,
  which are used for network enumeration and command-and-control infrastructure. This behavior is a precursor
  to credential-based attacks against Microsoft Exchange servers.
references:
- https://www.theregister.com/security/2026/10/08/us-disrupts-chinese-hacking-tools-as-7-govts-warn-of-prc-spies-stealing-sensitive-data-worldwide/5302107
