detection:
  selection:
    DestinationHostname|contains:
    - 98aicai.com
    - youtubecard.com
    - c0cc.cc
    - 98aicode.com
    - outlook3650.com
    - linkedinns.net
  condition: selection
falsepositives:
- Legitimate email or social media services with similar naming conventions
- CDN or proxy services that may resolve to these domains if compromised or misconfigured
level: high
