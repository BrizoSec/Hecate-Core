    TargetFilename|endswith: \nvidia-sysruntime.exe
  condition: selection
falsepositives:
- Legitimate NVIDIA driver installations or updates may create files with similar naming conventions in
  system directories.
- Other software vendors using 'nvidia' branding for unrelated hardware components.
