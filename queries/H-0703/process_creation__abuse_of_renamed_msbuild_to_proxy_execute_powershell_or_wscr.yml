title: Abuse of Renamed MSBuild to Proxy Execute PowerShell or WScript
id: ea789934-9580-445d-ae40-fe33824e9dc6
status: experimental
description: Detects the execution of a process named BuildCoordinator.exe (a renamed MSBuild binary)
  that spawns PowerShell or Windows Script Host interpreters. This behavior is consistent with LabubaRAT
  deployment techniques where trusted developer utilities are masqueraded to execute malicious scripts
  for deploying Rust-based implants.
references:
- https://blackpointcyber.com/blog/threat-snapshot-labubarat/
author: hecate (auto-generated draft - requires analyst review)
date: '2026-10-11'
tags:
- attack.t1036
- attack.t1059.001
- attack.t1059.003
- attack.t1059.007
logsource:
  category: process_creation
  product: windows
detection:
  selection_buildcoordinator:
    Image|endswith: \BuildCoordinator.exe
  selection_powershell:
    ParentImage|endswith: \BuildCoordinator.exe
    Image|endswith: \powershell.exe
  selection_wscript:
    ParentImage|endswith: \BuildCoordinator.exe
    Image|endswith: \wscript.exe
  condition: selection_buildcoordinator or (selection_powershell or selection_wscript)
falsepositives:
- Legitimate .NET build processes using MSBuild
- Automated deployment scripts invoking PowerShell via MSBuild
- Visual Studio build tasks
level: high
hunt_id: H-0703
hecate_review:
  verdict: keep
