title: Hunt for Tendyron OnKeySrv.exe DLL Sideloading via OnKeyToken_KEB.dll
id: 4300d3d7-6846-4677-8f74-192c5d057962
status: experimental
description: Detects the execution of Tendyron OnKeySrv.exe loading a DLL named OnKeyToken_KEB.dll. This
  behavior is indicative of DLL sideloading (T1140) used by BambooToken malware to establish covert C2
  channels. Legitimate instances of this process typically load standard system libraries or its own signed
  modules from System32; loading a DLL with this specific name from a non-standard location suggests malicious
  activity.
references:
- https://www.lumen.com/blog/en-us/the-banana-stand-brokering-and-managing-infections-across-asia-using-mqtt
author: hecate (auto-generated draft - requires analyst review)
date: '2026-10-09'
tags:
- attack.t1036
- attack.t1140
logsource:
  category: process_creation
detection:
  selection_process:
    Image|endswith: \OnKeySrv.exe
  selection_dll:
    CommandLine|contains: OnKeyToken_KEB.dll
  condition: selection_process and selection_dll
falsepositives:
- Legitimate Tendyron OnKey authentication software updates or configuration changes that may pass DLL
  names in command line arguments
- System administration scripts invoking the legitimate binary for troubleshooting
