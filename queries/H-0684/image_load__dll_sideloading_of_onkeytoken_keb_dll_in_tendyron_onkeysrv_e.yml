detection:
  selection_process:
    Image|endswith: \OnKeySrv.exe
  selection_dll:
    ImageLoaded|contains: OnKeyToken_KEB.dll
  condition: selection_process and selection_dll
falsepositives:
- Legitimate Tendyron OnKey authentication software updates or components
- System administration tools that may load similar named libraries in specific contexts
