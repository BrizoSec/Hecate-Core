title: DLL Sideloading of OnKeyToken_KEB.dll in Tendyron OnKeySrv.exe
id: c1717f6d-169e-4684-97d2-05e19d47f985
status: experimental
description: Detects the loading of a DLL named 'OnKeyToken_KEB.dll' by the legitimate process 'OnKeySrv.exe'.
  This behavior is indicative of DLL sideloading, where an adversary places a malicious DLL with the same
  name as a legitimate one in a directory searched before System32. The BambooToken malware family utilizes
  this technique to establish covert command and control via MQTT.
references:
- https://www.lumen.com/blog/en-us/the-banana-stand-brokering-and-managing-infections-across-asia-using-mqtt
