title: Linux Process Masquerading as Init with Known C2 Hashes
id: d3a9e02a-8eeb-45a2-be5e-0ea8181b0d57
status: experimental
description: Detects the execution of a binary masquerading as 'init' (OriginalFileName contains 'init')
  that matches known malicious file hashes associated with the ClingSTUN campaign. This targets the persistence
  mechanism where malware disguises itself as the init process to maintain C2 connectivity via STUN servers.
