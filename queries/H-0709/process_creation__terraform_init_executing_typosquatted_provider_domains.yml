title: Terraform Init Executing Typosquatted Provider Domains
id: 091a6345-fa08-42d7-b7fe-425a497dd0ff
status: experimental
description: Detects the execution of 'terraform init' with command line arguments referencing known typosquatted
  Terraform provider domains (youaws.io, hashicorp-terraform.io). This behavior indicates an attempt to
  force Terraform to download malicious providers from attacker-controlled registries instead of official
  HashiCorp sources, delivering macOS backdoors like FLATROOF/ROOFDECK.
references:
- https://www.sentinelone.com/labs/dont-call-us-well-call-your-apis-tradertraitor-backdoors-resurface-on-victim-with-no-crypto-ties/
author: hecate (auto-generated draft - requires analyst review)
date: '2026-10-11'
tags:
- attack.t1059.004
- attack.t1204.002
logsource:
  category: process_creation
detection:
  selection:
    Image|endswith: /usr/local/bin/terraform
    CommandLine|contains: init
  condition: selection
falsepositives:
- Legitimate Terraform workflows using official HashiCorp registries
- Internal corporate Terraform registries configured in terraform.rc or environment variables
level: high
hunt_id: H-0709
