title: Terraform Provider Download to Typosquatted Domain
id: 1e89f733-34de-4c47-80ff-bcb6fa9aba0f
status: experimental
description: Detects network connections to known typosquatted domains used by the TraderTraitor group
  to deliver malicious Terraform providers. These domains mimic official HashiCorp registries to trick
  developers into downloading backdoors (FLATROOF/ROOFDECK) during 'terraform init' operations.
references:
- https://www.sentinelone.com/labs/dont-call-us-well-call-your-apis-tradertraitor-backdoors-resurface-on-victim-with-no-crypto-ties/
author: hecate (auto-generated draft - requires analyst review)
date: '2026-10-11'
tags:
- attack.t1195.002
logsource:
  category: network_connection
detection:
  selection:
    DestinationHostname|contains:
    - youaws.io
    - hashicorp-terraform.io
  condition: selection
falsepositives:
- Legitimate use of proxy or DNS sinkhole resolving to similar domains
- Internal development environments using custom provider registries with similar naming conventions
level: high
hunt_id: H-0709
hecate_review:
  verdict: keep
