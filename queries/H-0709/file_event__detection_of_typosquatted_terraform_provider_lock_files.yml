title: Detection of Typosquatted Terraform Provider Lock Files
id: 55463c7b-f782-43cf-9988-418170c106b0
status: experimental
description: Detects the creation of .terraform.lock.hcl files containing typosquatted domain indicators
  (youaws.io, hashicorp-terraform.io) associated with the TraderTraitor group's FLATROOF/ROOFDECK backdoor
  campaign. This targets the supply chain compromise where weaponized lock files force Terraform to download
  malicious providers from fake registries.
references:
- https://www.sentinelone.com/labs/dont-call-us-well-call-your-apis-tradertraitor-backdoors-resurface-on-victim-with-no-crypto-ties/
author: hecate (auto-generated draft - requires analyst review)
date: '2026-10-11'
tags:
- attack.t1036
- attack.t1070.004
logsource:
  category: file_event
detection:
  selection_lockfile:
    TargetFilename|endswith: .terraform.lock.hcl
  selection_content_domains:
    Image|contains: hashicorp-terraform.io
  condition: selection_lockfile and selection_content_domains
falsepositives:
- Legitimate Terraform projects initializing providers from official HashiCorp registry
- Internal CI/CD pipelines creating lock files for dependency management
level: high
hunt_id: H-0709
hecate_review:
  verdict: revise
  issues:
  - The rule uses 'Image|contains' to detect domain indicators, which is incorrect for a file content
    detection scenario. The 'Image' field in file_event logs typically refers to the executable image
    name (e.g., terraform.exe), not the file contents or target filename. To detect typosquatted domains
    within a lock file, the rule should inspect the file content (e.g., using 'Content|contains' or similar
    logic depending on the specific SIEM/Sigma syntax for file content) rather than the process image
    name.
  - The hypothesis mentions 'weaponized lock files', implying the detection should focus on the presence
    of malicious domains *within* the lock file, not just the creation of a lock file by a process whose
    image name contains the domain (which is nonsensical).
  unverified_contradiction: The rule attempts to detect typosquatted domains in the lock file content
    but uses the 'Image' field which refers to the executing process, not the file content. The report
    describes the threat as malicious providers being downloaded via typosquatted domains *in* the lock
    file/registry configuration, not that the Terraform executable's image name contains these domains.
