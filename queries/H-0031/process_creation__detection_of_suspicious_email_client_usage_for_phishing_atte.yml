title: Detection of Suspicious Email Client Usage for Phishing Attempts
id: 9f954afc-c4f4-402a-bc79-eede0ceb0734
status: experimental
description: Identifies instances where email clients are used to send emails from unexpected or impersonated
  domains, which could indicate an AI-generated phishing campaign.
references:
- https://unit42.paloaltonetworks.com/ai-enabled-malware-analysis/
author: hecate (auto-generated draft - requires analyst review)
date: '2026-09-14'
tags:
- attack.t1059.003
logsource:
  category: process_creation
detection:
  selection:
    CommandLine|contains: .com --send-email
  filter:
    ParentImage|endswith: \outlook.exe
  condition: selection and not filter
falsepositives:
