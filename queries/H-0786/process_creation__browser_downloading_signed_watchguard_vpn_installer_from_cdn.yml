title: Browser Downloading Signed WatchGuard VPN Installer from CDN
id: 5ee540b4-af3a-47cb-ae67-f04880e7136c
status: experimental
description: Detects a web browser process (Chrome or Edge) initiating a download of a legitimate, digitally
  signed WatchGuard VPN installer executable from the official WatchGuard CDN. This behavior is suspicious
  in this context as it correlates with the subsequent phase of the threat hunt where credentials are
  harvested via phishing before the user installs the software.
references:
- https://www.huntress.com/blog/fake-watchguard-vpn-credential-phishing
author: hecate (auto-generated draft - requires analyst review)
date: '2026-10-15'
tags:
- attack.t1036
- attack.t1059.007
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    Image|endswith: \chrome.exe
    CommandLine|contains: WG-MVPN-SSL_12_11_5.exe
  condition: selection
falsepositives:
- Legitimate user downloading WatchGuard VPN client for work
- IT admin deploying WatchGuard software via browser-based management console
level: medium
hunt_id: H-0786
hecate_review:
  verdict: keep
