title: Aotera/Tedy Loader Execution for Browser Injection and Crypto Theft
id: 1f87628c-f789-4d9d-9237-472d72ac2405
status: experimental
description: Detects the execution of Aotera or Tedy loader binaries, which are used to inject Vidar stealers
  into browser processes. This rule targets the initial execution phase where the loader is spawned (often
  from a user-initiated context like Explorer or a downloader) before it performs in-memory injection
  into Chrome or Edge. It leverages the specific command-line indicators associated with the C2 communication
  and payload delivery paths identified in the intelligence.
references:
- https://www.netskope.com/blog/100k-in-crypto-drained-by-the-underground-operation
author: hecate (auto-generated draft - requires analyst review)
date: '2026-10-14'
tags:
- attack.t1059.007
logsource:
  category: process_creation
  product: windows
detection:
  selection_loader_exec:
    CommandLine|contains: /new/log/
    CommandLine|re: (startCrypt|startLoader|failed|success)
  condition: selection_loader_exec
falsepositives:
- Legitimate web browsers or download managers accessing HTTP resources with similar URL structures, though
  the specific hex-encoded log paths are rare in benign traffic
- Automated scripts or CI/CD pipelines interacting with internal logging endpoints that mimic the /new/log/
  structure
- User-generated content or bookmarks containing these URLs
level: high
hunt_id: H-0751
hecate_review:
  verdict: keep
