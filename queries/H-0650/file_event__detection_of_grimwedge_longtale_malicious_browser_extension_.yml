title: Detection of GRIMWEDGE/LONGTALE Malicious Browser Extension and JScript Artifacts
id: 11ead70e-9b0e-4635-bc43-b65f969920b9
status: experimental
description: Detects the creation of files associated with malicious Chrome extensions and JScript backdoors
  (GRIMWEDGE/LONGTALE) used by UTA0560/JungleBamboo. This rule targets the persistence mechanism where
  adversaries install browser extensions to establish surveillance and use JScript for credential access,
  bypassing traditional executable-focused controls.
references:
- https://www.volexity.com/blog/2026/09/09/mind-the-patch-gap-multiple-chinese-threat-actors-chain-0-day-exploits-in-chrome-windows/
author: hecate (auto-generated draft - requires analyst review)
date: '2026-10-07'
tags:
- attack.t1566
logsource:
  category: file_event
  product: windows
detection:
  selection_ext:
    TargetFilename|contains: /chrome-extension-
  selection_js:
    TargetFilename|endswith: .js
    Image|contains: chrome.exe
  condition: selection_ext or selection_js
falsepositives:
- Legitimate Chrome extension updates
- Developer testing of browser extensions
- Automated build scripts generating JS files in temp directories
level: high
hunt_id: H-0650
