description: Detects the creation of files associated with malicious npm packages ('api-nebula' or 'llm-nebula')
  identified in the NEBULA campaign. These packages are used to deliver obfuscated preinstall hooks that
  deploy a syscall-based Windows RAT masquerading as conhost.exe.
