title: Detection of Kimsuky GitPower Fake Zoom Installer and LNK Artifacts
id: a8afa5be-e4f2-4a94-8049-4699d1974c41
status: experimental
description: Detects the creation of malicious artifacts associated with the Kimsuky 'GitPower' campaign
  targeting Ukrainian policy experts. This rule looks for fake Zoom installers and LNK files in temporary
  or user directories, which are used as initial delivery mechanisms for PowerShell-based malware.
references:
- https://www.genians.co.kr/en/blog/threat_intelligence/operation-gitpower
author: hecate (auto-generated draft - requires analyst review)
date: '2026-10-15'
tags:
- attack.t1566
logsource:
  category: file_event
  product: windows
detection:
  selection_installer:
    TargetFilename|contains: zoom_installer.exe
    Image|endswith: \explorer.exe
  selection_lnk:
    TargetFilename|endswith: .lnk
    Image|endswith: \explorer.exe
  condition: selection_installer or selection_lnk
falsepositives:
- Legitimate Zoom updates or installations
- User-created shortcuts in temporary folders
level: high
hunt_id: H-0784
hecate_review:
  verdict: keep
