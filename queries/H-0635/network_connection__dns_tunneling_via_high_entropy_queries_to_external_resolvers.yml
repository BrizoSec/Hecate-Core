title: DNS Tunneling via High-Entropy Queries to External Resolvers
id: 8eecadc9-a79a-4341-8e4b-e8c4ab37ba0d
status: experimental
description: Detects potential DNS tunneling exfiltration by identifying non-standard processes initiating
  high-volume DNS queries with high-entropy subdomains to external recursive resolvers. This behavior
  aligns with T1438 and T1071.004, where adversaries encode data in DNS payloads to bypass traditional
  firewall controls.
references:
- https://localhost:8443/events/view/1816
author: hecate (auto-generated draft - requires analyst review)
date: '2026-10-06'
tags:
- attack.t1071.004
logsource:
  category: network_connection
detection:
  selection_dns:
    DestinationPort: 53
    DestinationHostname|re: '[a-zA-Z0-9]{20,}'
  selection_proc:
    Image|contains: /usr/lib/systemd/systemd-resolved
  filter_standard_resolver:
    Image|endswith: \selection_proc
  condition: selection_dns and not filter_standard_resolver
falsepositives:
- Legitimate DNSSEC validation queries
- Cloud provider health checks using long hostnames
- Automated certificate renewal services (e.g., certbot) querying external resolvers
level: high
hunt_id: H-0635
hecate_review:
  verdict: revise
  issues:
  - The source passages list is empty, so the rule cannot be validated against specific evidence.
  - The logsource 'network_connection' typically captures connection events (IPs/Ports) rather than DNS
