title: Detection of Equation of Compromise Malicious Library Artifacts in npm Packages
id: 1073d513-f990-47e0-9f76-cb8de25fe959
status: experimental
description: Detects the creation of specific malicious library files (event.js, graph.js) within npm
  package directories. These artifacts are part of the 'Equation of Compromise' supply-chain attack, where
  legitimate-looking math libraries are replaced with encrypted payloads containing live cryptographic
  triggers.
references:
- https://research.jfrog.com/post/equation-of-compromise/
author: hecate (auto-generated draft - requires analyst review)
date: '2026-10-11'
tags:
- attack.t1027
- attack.t1036
logsource:
  category: file_event
detection:
  selection_lib_event:
    TargetFilename|contains: /lib/cjs/utils/event.js
  selection_lib_graph:
    TargetFilename|contains: /lib/cjs/utils/graph.js
  condition: selection_lib_event or selection_lib_graph
falsepositives:
- Legitimate npm packages that include utility libraries with similar naming conventions
- Standard build artifacts from legitimate open-source projects
level: high
hunt_id: H-0713
hecate_review:
  verdict: keep
