title: Execution of WScript via Scheduled Task for Persistence
id: c123fa39-45d3-4e9c-9ff1-717687bc5739
status: experimental
description: Detects the creation of a scheduled task named 'UpdateCheck' followed by the execution of
  wscript.exe or cscript.exe from a temporary directory. This behavior aligns with the SocGholish campaign
  targeting Washington State election infrastructure, where adversaries use obfuscated WScript commands
  and scheduled tasks to establish persistence.
references: []
author: hecate (auto-generated draft - requires analyst review)
date: '2026-10-08'
tags:
- attack.t1027.006
- attack.t1053.005
- attack.t1059.007
logsource:
  category: process_creation
  product: windows
detection:
  selection_schtasks:
    Image|endswith: \schtasks.exe
    CommandLine|contains: /create
  selection_wscript:
    Image|endswith: \wscript.exe
    CommandLine|contains: '%APPDATA%\Local\Temp'
  condition: selection_schtasks or selection_wscript
falsepositives:
- Legitimate system maintenance scripts
- Software update checkers using scheduled tasks
- Administrative automation using WScript in temp directories
level: high
