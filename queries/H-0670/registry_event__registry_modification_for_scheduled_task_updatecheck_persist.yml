title: Registry Modification for Scheduled Task UpdateCheck Persistence
id: b8b5938b-5ec2-4bf7-bcc3-f75420366109
status: experimental
description: Detects registry modifications associated with the creation or configuration of a scheduled
  task named 'UpdateCheck'. While scheduled tasks are primarily managed via schtasks.exe, certain malware
  families or installation routines may manipulate registry keys under HKLM\SOFTWARE\Microsoft\Windows
  NT\CurrentVersion\Schedule\TaskCache to persist or configure these tasks. This aligns with threat intelligence
  regarding SocGholish campaigns targeting election infrastructure.
references: []
author: hecate (auto-generated draft - requires analyst review)
date: '2026-10-08'
tags:
- attack.t1053.005
logsource:
  category: registry_event
  product: windows
detection:
  selection:
    TargetObject|contains: \Microsoft\Windows NT\CurrentVersion\Schedule\TaskCache\Tasks\{
    EventType: RegSetValue
  condition: selection
falsepositives:
- Legitimate software installers that create scheduled tasks via standard APIs which may write to this
  registry path
- Windows Update or system maintenance tools configuring task schedules
- Administrative scripts managing scheduled tasks
level: medium
hunt_id: H-0670
hecate_review:
  verdict: keep
