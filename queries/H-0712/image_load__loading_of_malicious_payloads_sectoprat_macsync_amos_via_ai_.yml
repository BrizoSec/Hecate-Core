title: Loading of Malicious Payloads SectopRAT MacSync AMOS via AI Campaign
id: 2e4e3a88-6c7b-4a1f-9d9d-acd6fab6db3a
status: experimental
description: Detects the loading of known malicious binaries (SectopRAT, MacSync, AMOS) associated with
  the SEO-poisoned AI platform campaign. These binaries are delivered to establish persistence and execute
  commands on Windows endpoints.
references:
- https://nsfocusglobal.com/ai-security-incident-case-trusted-ai-platforms-become-a-new-channel-for-malware-distribution/
author: hecate (auto-generated draft - requires analyst review)
date: '2026-10-11'
tags:
- attack.t1574.001
logsource:
  category: image_load
  product: windows
detection:
  selection_malware:
    ImageLoaded|endswith: \AMOS.exe
  condition: selection_malware
falsepositives:
- Legitimate software with similar naming conventions (unlikely given specific names)
- Custom internal tools named SectopRAT or MacSync (rare)
level: high
hunt_id: H-0712
hecate_review:
  verdict: reject
  unverified_contradiction: 'The rule specifies `logsource: product: windows` and detects `AMOS.exe`.
    However, passage [24] explicitly states that AMOS was delivered via SEO-poisoned pages on macOS (via
