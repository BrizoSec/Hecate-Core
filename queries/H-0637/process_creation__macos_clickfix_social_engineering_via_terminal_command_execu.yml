title: macOS ClickFix Social Engineering via Terminal Command Execution
id: a5aa936c-bb37-42df-bfb7-4ce6a2f247b1
status: experimental
description: Detects the execution of malicious curl and osascript commands typical of the MacSync ClickFix
  campaign. Adversaries trick users into pasting these commands into the Terminal to download and execute
  a Mach-O stager in memory, bypassing Gatekeeper. This rule targets the specific command-line patterns
  used to fetch payloads and execute AppleScript for data exfiltration.
references:
- https://www.seqrite.com/blog/macsync-the-evasive-macos-stealer-exploiting-clickfix-lures/
author: hecate (auto-generated draft - requires analyst review)
date: '2026-10-06'
tags:
- attack.t1059.002
- attack.t1059.004
- attack.t1204.004
- attack.t1620
logsource:
  category: process_creation
detection:
  selection_curl_osascript:
    CommandLine|contains: 'curl -k -s –max-time 12 -H “User-Agent: %s” -H “api-key: %s” “%s” | osascript'
  selection_mozilla_ua:
    CommandLine|contains: Mozilla/5.0 (Macintosh; Intel Mac OS X 10_15_7) CFNetwork/Darwin 26.0.0 AppleWebKit/537.36
  condition: selection_curl_osascript or selection_mozilla_ua
falsepositives:
- Legitimate system administration scripts using curl and osascript
- Developer tools fetching remote configuration or assets
- Automated deployment scripts mimicking standard HTTP user agents
level: high
hunt_id: H-0637
hecate_review:
  verdict: keep
  issues:
  - 'The rule uses a literal string match for the command line pattern `curl -k -s –max-time 12 -H “User-Agent:
    %s” -H “api-key: %s” “%s” | osascript`. In reality, `%s` are format specifiers that would be replaced
    by actual values (IP/URL, User-Agent string, API key) at runtime. A literal match will fail to detect
    the actual executed command unless the log source preserves these exact placeholders, which is highly
    unlikely for standard process creation logs.'
  - The rule relies on `CommandLine|contains` with a complex multi-part string. If the logging system
    splits arguments or normalizes whitespace, this detection will likely miss the event.
