title: Detection of ClickFix Social Engineering via osascript Image Load
id: 9b99978f-9adf-4358-820a-f69fabd1c5ee
status: experimental
description: Detects the loading of the osascript binary, which is a key component in the MacSync campaign's
  ClickFix technique. Adversaries use this to execute malicious commands in-memory, bypassing Gatekeeper
  by leveraging user interaction to paste commands into Terminal. This rule targets the specific execution
  engine used for the in-memory AppleScript payload.
references:
- https://www.seqrite.com/blog/macsync-the-evasive-macos-stealer-exploiting-clickfix-lures/
author: hecate (auto-generated draft - requires analyst review)
date: '2026-10-06'
tags:
- attack.t1620
logsource:
  category: image_load
detection:
  selection:
    ImageLoaded|endswith: /usr/bin/osascript
  condition: selection
falsepositives:
- Legitimate administrative scripts executed by system administrators
- Automated build or deployment tools using AppleScript
- User-initiated automation via Automator or Script Editor
level: high
hunt_id: H-0637
hecate_review:
  verdict: keep
