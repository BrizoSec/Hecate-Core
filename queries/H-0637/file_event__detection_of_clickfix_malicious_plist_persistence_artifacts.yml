title: Detection of ClickFix Malicious Plist Persistence Artifacts
id: e31d976c-76eb-4303-918e-6306ed68037f
status: experimental
description: Detects the creation of malicious LaunchAgent plist files used by the MacSync campaign to
  establish persistence. Adversaries use social engineering (ClickFix) to coerce users into executing
  commands that write these plists to ~/Library/LaunchAgents/ or /Library/LaunchDaemons/, bypassing Gatekeeper
  and enabling daemonized execution.
references:
- https://www.seqrite.com/blog/macsync-the-evasive-macos-stealer-exploiting-clickfix-lures/
author: hecate (auto-generated draft - requires analyst review)
date: '2026-10-06'
tags:
- attack.t1027
- attack.t1105
logsource:
  category: file_event
detection:
  selection_plist:
    TargetFilename|endswith: .plist
  selection_path:
    TargetFilename|contains: /Library/LaunchAgents/
  condition: selection_plist and selection_path
falsepositives:
- Legitimate software installers writing LaunchAgents (e.g., Google Chrome, Adobe Creative Cloud)
- System updates modifying daemon configurations
- User-installed productivity tools creating helper plists
level: high
hunt_id: H-0637
hecate_review:
  verdict: keep
  issues:
  - The rule focuses on persistence artifacts (plist creation) while the hypothesis emphasizes the initial
    social engineering and in-memory execution aspects, but this is a valid detection strategy for the
    campaign described.
