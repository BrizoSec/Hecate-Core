title: DNS Query to ClickFix C2 Infrastructure Domains
id: b9abf084-5ca1-4011-bcd3-16313343074f
status: experimental
description: Detects DNS queries for domains associated with the MacSync ClickFix campaign. These domains
  are used as Command and Control (C2) endpoints or payload delivery hosts in social engineering attacks
  targeting macOS users. The presence of these domains indicates an active attempt to deliver malicious
  terminal commands via the ClickFix technique.
references:
- https://www.seqrite.com/blog/macsync-the-evasive-macos-stealer-exploiting-clickfix-lures/
