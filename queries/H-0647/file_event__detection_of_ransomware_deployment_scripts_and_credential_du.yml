title: Detection of Ransomware Deployment Scripts and Credential Dumping Artifacts
id: 174fa323-e46e-46c6-832b-5128f2cc4f82
status: experimental
description: Detects the creation of specific files associated with ransomware deployment (deploy_locker.py,
  veeam_kill.py) and credential dumping/exfiltration (ntds.dit, SAM, SYSTEM, ntds.txt, SAM.txt). This
  targets the staging phase of attacks against SME networks where adversaries automate encryption and
  data theft.
references:
- https://blog.talosintelligence.com/ransomware-incidents-in-japan-in-the-first-half-of-2026/
author: hecate (auto-generated draft - requires analyst review)
date: '2026-10-07'
tags:
- attack.t1070.003
logsource:
  category: file_event
  product: windows
detection:
  selection_scripts:
    TargetFilename|endswith:
    - deploy_locker.py
    - veeam_kill.py
  selection_creds:
    TargetFilename|endswith:
    - ntds.dit
    - SAM
    - SYSTEM
    - ntds.txt
    - SAM.txt
  condition: selection_scripts or selection_creds
falsepositives:
- Legitimate Python scripts for system administration
- Backup software creating database dumps (ntds.dit, SAM)
- Security tools performing credential auditing
level: high
hunt_id: H-0647
hecate_review:
  verdict: keep
