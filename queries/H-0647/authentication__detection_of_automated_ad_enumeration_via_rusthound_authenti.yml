title: Detection of Automated AD Enumeration via RustHound Authentication Patterns
id: 5215ad0c-e5ad-44fb-bfd6-18e7f6d1aa7f
status: experimental
description: Detects authentication events consistent with the use of RustHound or similar automated Active
  Directory enumeration tools. These tools often perform rapid, programmatic Kerberos or NTLM authentications
