  product: windows
detection:
  selection:
    QueryName|contains:
    - hosthiifran.screenconnect.com
    - instance-uxh86b-relay.screenconnect.com
    - relay.goldenmelon.us
    - relay.illuminantgroup.net
    - scx.illuminantgroup.net
    - wir.consultingics.com
    - victory.mkc1.digitaloceanspaces.com
  condition: selection
falsepositives:
- Legitimate use of ScreenConnect (ConnectWise Control) by IT support staff
- Users accessing legitimate Adobe update domains if they share similar naming patterns (though unlikely
  given the specific rogue subdomains)
- Cloud storage services like DigitalOcean Spaces used for benign file hosting
level: high
