title: DNS Query for Rogue ScreenConnect Relay and Phishing Infrastructure
id: e6192227-b4d0-4d9b-8593-ca8b00ea680e
status: experimental
description: Detects DNS queries to domains associated with a Browser-in-the-Browser phishing campaign
  delivering rogue ScreenConnect installers. This behavior indicates an adversary establishing communication
  with their Command and Control (C2) infrastructure or downloading the malicious payload disguised as
  legitimate software updates.
references:
- https://www.huntress.com/blog/phishing-bitb-rmm-attacks
author: hecate (auto-generated draft - requires analyst review)
date: '2026-10-07'
tags:
