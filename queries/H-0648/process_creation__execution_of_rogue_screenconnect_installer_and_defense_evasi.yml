title: Execution of Rogue ScreenConnect Installer and Defense Evasion Binaries
id: aace803b-8ddc-4b26-bb79-404e1418b7d4
status: experimental
description: Detects the execution of known rogue ScreenConnect installers disguised as Adobe updates,
  followed by the execution of defense evasion binaries (HideCursor.exe, HideUL.exe) used to conceal malicious
  activity. This behavior aligns with Browser-in-the-Browser phishing campaigns delivering Remote Management
  Tools for persistence.
references:
- https://www.huntress.com/blog/phishing-bitb-rmm-attacks
author: hecate (auto-generated draft - requires analyst review)
date: '2026-10-07'
tags:
- attack.t1036.005
- attack.t1059.003
- attack.t1204.001
- attack.t1204.004
- attack.t1543.003
logsource:
  category: process_creation
  product: windows
detection:
  selection_installer:
    CommandLine|contains: ScreenConnect.ClientSetup.exe
  selection_evasion:
    Image|endswith: \HideCursor.exe
    CommandLine|contains: HideCursor.exe
  condition: selection_installer or selection_evasion
falsepositives:
- Legitimate ScreenConnect/ConnectWise Control installations by IT administrators
- Adobe Creative Cloud updates using similar naming conventions in temporary directories
level: high
hunt_id: H-0648
hecate_review:
  verdict: keep
