title: Detection of ScreenConnect Client Setup File Creation via Phishing Campaign
id: d4720ede-cadb-47e8-b1be-bdf7535ec4e9
status: experimental
description: Detects the creation of the specific ScreenConnect.ClientSetup.exe file associated with an
  active phishing campaign using fake holiday event invitations. This rule targets the persistence mechanism
  where a legitimate installer is dropped to disk, often in user-writable directories like Downloads or
  Temp, facilitating unauthorized remote access.
references:
- https://cofense.com/blog/rsvp-to-disaster-how-one-click-installs-a-rat
