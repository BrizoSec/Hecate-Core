title: WebDAV UNC Path Execution via rundll32.exe with Randomized Subdomains and Signed Driver Persistence
id: 5c0c6ced-49ce-4f06-8631-6c659e1bd364
status: experimental
description: Detects a multi-stage attack chain involving WebDAV UNC path execution through rundll32.exe
  with randomized subdomains, followed by execution of a signed driver (DCRCVDrv.sys) and a loader (Secur32.dll),
  indicative of credential and cryptocurrency theft via stealthy, memory-resident malware. The behavior
  includes use of XOR and LZNT1 in command lines, and derivation of installation path via MachineGuid,
  all consistent with advanced persistent threat activity.
references:
- https://blog.talosintelligence.com/clearfake-webdav-infection-chain/
author: hecate (auto-generated draft - requires analyst review)
date: '2026-10-04'
tags:
- attack.t1053.005
- attack.t1059.001
- attack.t1059.007
- attack.t1140
- attack.t1204.004
- attack.t1620
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    Image|endswith: \rundll32.exe
    CommandLine|contains: MachineGuid|zdozwoqx3c
    ParentImage|endswith: \explorer.exe
  filter:
    CommandLine|contains: C:\Windows\System32\
  condition: selection and not filter
falsepositives:
- Legitimate use of rundll32.exe with custom payloads in enterprise scripting environments
- Security tooling that uses XOR and LZNT1 for obfuscation during execution
level: high
hunt_id: H-0623
hecate_review:
  verdict: revise
  issues:
  - The rule references 'Secur32.dll' as a loader, but the source passages do not mention this file; instead,
    they reference 'pf.ch' and 'verification.google' as the initial DLLs executed via WebDAV.
  - The rule includes 'XOR and LZNT1 in command lines' as a detection indicator, but the source passages
    do not mention XOR or LZNT1 in the command line; these are not explicitly tied to the observed behavior.
  - The rule references 'MachineGuid' in the command line with a hardcoded string 'zdozwoqx3c', which
    is not present in any passage and appears to be fabricated or misattributed.
  - The rule does not account for the actual C2 domains derived from blockchain interactions (e.g., 'lb.propertyfind.cc',
    'kffd3.vogueatelier.cc'), which are central to the hypothesis and described in passages [11], [12]–[15],
    but are not detectable via this rule.
  - The rule fails to detect the use of the WebClient service startup (passage [4]), which is a key part
    of the hypothesis and described behavior.
