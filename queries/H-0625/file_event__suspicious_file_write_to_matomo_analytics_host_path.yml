title: Suspicious File Write to Matomo Analytics Host Path
id: a61afd27-bae7-4a18-b7fb-8ef2c5437ea0
status: experimental
description: Detects file writes to paths associated with Matomo analytics infrastructure, specifically
  targeting the stats.us3.org domain, which is linked to the BengalSEO TDS. This behavior may indicate
  a malicious payload or configuration file being written in support of a multi-layered traffic distribution
  system used for malware delivery or tech support scams. The rule focuses on file system activity that
  aligns with the observed infrastructure reuse between analytics and redirection services.
