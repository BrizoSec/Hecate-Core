title: Request for a URL path named in the source intelligence
id: eafd276a-2bc9-40d6-9dad-fcadfcaabf6d
status: experimental
description: Deterministic IOC rule built from the indicators the source intelligence published, with
  no model involvement. Matches a proxy or web request for a current URL path the source published. URL
  paths appear only in proxy and web logs, not in endpoint file or process events.
references:
- https://www.group-ib.com/blog/grelosgtm/
author: hecate (auto-generated from source indicators - requires analyst review)
date: '2026-10-09'
