description: Detects DNS queries for domains associated with the GrelosGTM threat group, which abuses
  Google Tag Manager to inject WebSocket-based JavaScript sniffers on e-commerce platforms. These domains
  are used for command and control or payload delivery during payment card skimming campaigns.
