title: DLL Sideloading via Signed Canon or Stardock Executables
id: c759d3e0-77e9-4f5b-8a9b-68181e60e855
status: experimental
description: Detects the loading of non-standard DLLs by legitimate signed executables (Canon Configuration
  Reader, Stardock DeElevation Tool) which is a common technique for DLL sideloading to evade signature-based
  detection. This behavior aligns with the hypothesis of an eight-stage DLL sideloading chain using these
  specific binaries.
references:
- https://www.huntress.com/blog/chatgpt-custom-gpts-clickfix-rat
author: hecate (auto-generated draft - requires analyst review)
date: '2026-10-13'
tags:
- attack.t1574.001
logsource:
  category: image_load
  product: windows
detection:
  selection_signed:
    Signed: 'true'
    ImageLoaded|contains: .dll
  selection_parent:
    Image|endswith: \Canon Configuration Reader.exe
    ImageLoaded|contains: .dll
  selection_parent_stardock:
    Image|endswith: \Stardock DeElevation Tool.exe
    ImageLoaded|contains: .dll
  condition: (selection_signed and (selection_parent or selection_parent_stardock))
falsepositives:
- Legitimate Canon printer software updates
- Legitimate Stardock desktop customization tools
- Standard Windows DLL loading by these applications
level: high
hunt_id: H-0740
hecate_review:
  verdict: keep
