title: File Drop of ISOSimple.msi in User Temp Directories via PowerShell or CMD
id: 51a478ab-fc64-4012-80e1-99ea3e5bee8d
status: experimental
description: Detects the creation of 'ISOSimple.msi' in %TEMP% or %LOCALAPPDATA%, which is an indicator
  of the ClickFix social engineering payload delivery stage described in the hunt hypothesis. This file
  drop typically precedes the execution of signed binaries for DLL sideloading.
references:
- https://www.huntress.com/blog/chatgpt-custom-gpts-clickfix-rat
author: hecate (auto-generated draft - requires analyst review)
date: '2026-10-13'
tags:
- attack.t1070.004
- attack.t1566.002
logsource:
  category: file_event
  product: windows
detection:
  selection:
    TargetFilename|contains: ISOSimple.msi
    TargetFilename|startswith:
    - '%TEMP%\'
    - '%LOCALAPPDATA%\'
    - C:\Users\
    - C:\Temp\
  condition: selection
falsepositives:
- Legitimate ISO mounting tools (e.g., Daemon Tools, WinISO)
- Software installers dropping temporary ISO files
- System updates or drivers using temporary MSI packages
level: medium
hunt_id: H-0740
hecate_review:
  verdict: keep
