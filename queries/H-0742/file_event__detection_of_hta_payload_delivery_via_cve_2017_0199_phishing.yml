title: Detection of HTA Payload Delivery via CVE-2017-0199 Phishing Campaign
id: beffb346-6bdd-4958-91fc-93456e58cbe5
status: experimental
description: Detects the creation of specific malicious HTA files and associated steganographic PNG payloads
  linked to the blessedongrace.duckdns.org campaign targeting South Korean organizations. This rule focuses
  on the file artifacts created by the exploitation of CVE-2017-0199 via OLE2Link in Excel.
references:
- https://asec.ahnlab.com/en/95598
author: hecate (auto-generated draft - requires analyst review)
date: '2026-10-13'
tags:
- attack.t1027
- attack.t1036
logsource:
  category: file_event
  product: windows
detection:
  selection_hta:
    TargetFilename|contains: Weprovideforbesthingstocomebackgoodthings.Hta
  selection_png:
    TargetFilename|contains: Img_201031.Png
  condition: selection_hta or selection_png
falsepositives:
- Legitimate user-downloaded HTML Application files
- Screenshots or images saved with similar naming conventions
- Software installers containing embedded assets
level: high
hunt_id: H-0742
hecate_review:
  verdict: keep
