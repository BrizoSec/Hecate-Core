title: macOS Stealer Execution via Zsh Script and Mach-O Binary in /tmp
id: ce23164b-560b-4ea0-ae24-ce19caaa80b8
status: experimental
description: Detects the execution of Z-shell scripts and associated Mach-O binaries located in /tmp or
  hidden directories within /Library/Application Support, consistent with the AMOS Stealer campaign's
  delivery mechanism. This behavior indicates an adversary attempting to install persistent malware by
  masquerading as legitimate system components.
references:
- https://unit42.paloaltonetworks.com/atomic-macos-amos-stealer-activity/
author: hecate (auto-generated draft - requires analyst review)
date: '2026-10-07'
tags:
- attack.t1036
- attack.t1059.004
- attack.t1204.004
logsource:
  category: process_creation
detection:
  selection_script:
    CommandLine|contains: /tmp/starter
  selection_binary:
    Image|endswith: /tmp/helper
  selection_hidden_dir:
    CommandLine|contains: /Library/Application Support/.com.apple.metadata.mds/
  condition: selection_script or selection_binary or selection_hidden_dir
falsepositives:
- Legitimate software installers using /tmp for staging
- System maintenance scripts accessing Application Support directories
level: high
hunt_id: H-0643
hecate_review:
  verdict: keep
