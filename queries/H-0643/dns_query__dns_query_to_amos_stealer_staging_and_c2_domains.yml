title: DNS Query to AMOS Stealer Staging and C2 Domains
id: 07dd00ea-434f-4a63-a721-0f0b56b110aa
status: experimental
description: Detects DNS lookups for domains associated with the Atomic macOS (AMOS) Stealer campaign.
  These domains are used for staging Z-shell scripts and exfiltrating harvested user data via HTTP POST
  requests. This behavior indicates active infection or command-and-control communication.
references:
