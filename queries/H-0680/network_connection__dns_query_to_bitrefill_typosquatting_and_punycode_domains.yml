title: DNS Query to Bitrefill Typosquatting and Punycode Domains
id: c34bee1d-afcb-431c-a2b5-e45efcb18c76
status: experimental
description: Detects DNS queries to known lookalike domains registered by threat actors to mimic the legitimate
  cryptocurrency gift card retailer Bitrefill. These domains are used in search engine manipulation campaigns
  to direct victims to fake checkout pages for crypto theft.
references:
- https://www.malwarebytes.com/blog/threat-intel/2026/09/search-results-are-sending-people-to-fake-bitrefill-checkouts
author: hecate (auto-generated draft - requires analyst review)
