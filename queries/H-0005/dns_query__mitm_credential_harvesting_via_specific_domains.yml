title: MITM Credential Harvesting via Specific Domains
id: 908733b4-c842-4af3-8775-28a8acae0244
status: experimental
description: Detects DNS queries to known malicious domains used by adversaries for MITM attacks to harvest
  credentials.
references:
- https://www.cloudsek.com/blog/tracking-bigbear-2-0-evilginx2-phishing-campaign
author: hecate (auto-generated draft - requires analyst review)
date: '2026-09-08'
tags:
- attack.t1555
- attack.t1573
logsource:
  category: dns_query
  product: windows
detection:
  selection:
    QueryName|endswith:
    - .com
  filter:
    QueryName|contains:
    - dronalms.com
    - ccpipharma.com
    - knowncontractor.com
    - hnospascualfadon.com
    - annastudios-paros.com
    - arrmmy.com
    - captelind.com
    - cifutura.com
    - daengrentacar.com
    - dataclust.com
    - login.evil-domain.com
    - login.konceptenterprises.com
    - management.daengrentacar.com
    - management.michaelmarcotte.com
  condition: selection and filter
falsepositives:
- DNS queries to known malicious domains may occur due to administrative oversight or user error when
  entering URLs
level: medium
related:
- id: H-0005
  type: derived
