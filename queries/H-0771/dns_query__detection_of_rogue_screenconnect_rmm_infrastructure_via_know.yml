title: Detection of Rogue ScreenConnect RMM Infrastructure via Known Malicious Domains
id: d8fd158b-9b19-4999-b030-c0cc0ad66306
status: experimental
description: Detects DNS queries for domains associated with an active campaign abusing trusted Microsoft
  infrastructure (PowerBI) and attacker-controlled subdomains to deliver rogue ScreenConnect RMM tools.
  This rule targets the initial access and payload delivery phase where victims are filtered via browser
  fingerprinting before downloading malicious installers.
references:
- https://www.huntress.com/blog/screenconnect-power-bi
author: hecate (auto-generated draft - requires analyst review)
date: '2026-10-15'
tags:
- attack.t1113
- attack.t1566.001
- attack.t1566.002
logsource:
  category: dns_query
  product: windows
detection:
  selection:
    QueryName|contains:
    - burnsworth.site
    - dailylifeproject.site
    - essaywritingservice.site
    - onthegotree.site
    - openpediatrics.site
    - hamham27.screenconnect.com
    - instance-g01s1n-relay.screenconnect.com
    - check.vykyn.click
    - app.powerbi.com
  condition: selection
falsepositives:
- Legitimate use of app.powerbi.com for business analytics
- Users accessing legitimate ScreenConnect instances (though hamham27 and instance-g01s1n-relay are specific
  to this campaign)
- Phishing domains mimicking these names
level: high
