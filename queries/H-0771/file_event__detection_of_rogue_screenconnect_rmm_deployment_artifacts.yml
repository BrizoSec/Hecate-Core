title: Detection of Rogue ScreenConnect RMM Deployment Artifacts
id: 55a514a2-9913-4b4e-837b-920bf6dd46ef
status: experimental
description: Detects the creation of specific file artifacts associated with a rogue ScreenConnect Remote
  Monitoring and Management (RMM) deployment. This behavior aligns with an active threat campaign where
  adversaries use legitimate Microsoft Power BI domains for initial access and attacker-controlled subdomains
  for payload delivery, followed by defense evasion and persistence mechanisms. The rule specifically
  targets the file artifacts written to disk during this chain.
references:
- https://www.huntress.com/blog/screenconnect-power-bi
author: hecate (auto-generated draft - requires analyst review)
date: '2026-10-15'
tags:
- attack.t1053.005
- attack.t1566.001
- attack.t1566.002
logsource:
  category: file_event
  product: windows
detection:
  selection:
    TargetFilename|contains:
    - ScreenConnect.ClientSetup.exe
    - ScreenConnect.ClientSetup.msi
    - HideUL_x64.exe
    - LyN03DvVjUKPrun.cmd
    - SCAutoFix.ps1
  condition: selection
falsepositives:
- Legitimate ScreenConnect installations by IT administrators
- Authorized RMM tool deployments
level: high
hunt_id: H-0771
hecate_review:
  verdict: keep
