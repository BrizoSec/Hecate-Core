title: Suspicious Tampermonkey Script File Creation from Google Visualization API
id: 398df337-e8b8-4dec-a86e-4cbf60e90090
status: experimental
description: Detects creation of Tampermonkey script files originating from Google Sheets via the Google
  Visualization API, which may be used to exfiltrate cryptocurrency data from trading platforms like SimpleSwap.io.
  This behavior aligns with T1027 (Obfuscated Files or Information) and indicates potential malicious
  script injection via browser extensions.
references:
- https://blog.talosintelligence.com/clickfix-moves-into-the-browser/
author: hecate (auto-generated draft - requires analyst review)
date: '2026-10-03'
tags:
- attack.t1027
logsource:
  category: file_event
detection:
  selection:
    TargetFilename|endswith: \Tampermonkey.exe
  condition: selection
falsepositives:
- Legitimate browser extension installation scripts
- User-created Tampermonkey scripts for automation
level: medium
hunt_id: H-0622
hecate_review:
  verdict: revise
  issues:
  - The rule targets 'Tampermonkey.exe', which is a misleading file extension; Tampermonkey scripts are
    typically .user.js files, not .exe files.
  - The rule focuses on file creation from the Google Visualization API, but the source passages describe
    script execution via 'javascript:' protocol or Tampermonkey plugin activation, not file creation.
  - 'The rule does not capture the actual behavior described: execution via ''javascript:'' in the browser
    bar or plugin-based activation on visiting SimpleSwap.io.'
