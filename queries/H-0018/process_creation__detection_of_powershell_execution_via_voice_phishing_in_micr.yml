title: Detection of PowerShell Execution via Voice Phishing in Microsoft Teams
id: 00043402-ee8c-411b-96da-db6d42c8bae6
status: experimental
description: This rule aims to detect instances where adversaries use voice phishing tactics within Microsoft
  Teams to execute malicious PowerShell scripts, which is a common technique used by Spring Ring attackers.
  The detection focuses on the execution of PowerShell with bypass execution policy and specific file
  paths indicative of malware.
references:
- https://unit42.paloaltonetworks.com/spring-ring-voice-phishing-campaigns/
author: hecate (auto-generated draft - requires analyst review)
date: '2026-09-26'
tags:
- attack.t1059.001
logsource:
  category: process_creation
detection:
  selection:
    Image|endswith: \powershell.exe
    CommandLine|contains: -ExecutionPolicy Bypass -File C:\path\to\malware.ps1
  condition: selection
falsepositives:
- Administrative use of PowerShell with bypass execution policy
level: medium
hunt_id: H-0018
