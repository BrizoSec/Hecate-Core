title: Detection of ClickFix Mach-O Stager via Spoofed LaunchAgent Persistence
id: e6c4ac98-21a5-4794-bd01-a52342e83014
status: experimental
description: Detects the loading of the MacSync stealer stager binary (com.utils.Launcher) which is deployed
  as part of a ClickFix social engineering attack. This rule specifically targets the persistence mechanism
  where malicious LaunchAgents are installed with spoofed names (e.g., com.google.keystone.plist or com.apple.sync.plist)
  to evade detection, followed by the execution of the stager.
