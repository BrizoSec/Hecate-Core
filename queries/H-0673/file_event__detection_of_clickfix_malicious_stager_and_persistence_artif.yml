title: Detection of ClickFix Malicious Stager and Persistence Artifacts on macOS
id: 0daf6e4b-cb2e-4617-837c-0c2d652db9a2
status: experimental
description: Detects the creation of specific files associated with the MacSync stealer campaign. This
  includes the Mach-O stager binary located in /tmp, the temporary status file used during data exfiltration,
  and the staged archive of stolen credentials. The presence of these artifacts indicates a successful
  ClickFix social engineering attack where users were tricked into executing malicious Terminal commands.
