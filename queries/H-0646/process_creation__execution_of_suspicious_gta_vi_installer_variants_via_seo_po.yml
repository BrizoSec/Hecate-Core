title: Execution of Suspicious GTA VI Installer Variants via SEO Poisoning Campaign
id: f4e07d83-289f-45c2-81f2-ca86c92a8f50
status: experimental
description: Detects the execution of specific malicious executables associated with the Grand Theft Auto
  VI SEO poisoning campaign. These files, often disguised as game installers or fixers (e.g., rockstargamescrashfixer.exe),
  are dropped into %TEMP% to deliver malware families such as NJRAT, DCRAT, Mercurial Grabber, and Chaos.
  This rule targets the initial execution phase of this specific threat intelligence.
references:
- https://www.huntress.com/blog/fake-gta6-download-malware-analysis
author: hecate (auto-generated draft - requires analyst review)
date: '2026-10-07'
tags:
- attack.t1036
- attack.t1684
logsource:
  category: process_creation
  product: windows
detection:
  selection_hash:
    Image|endswith: .exe
    Hashes|contains:
    - ea991bc9334b36a6b958f564ee716776
    - 0e39e8d7b641bcda4376ebbfeff7b12e
    - 15eca4a3f7350423cf4db0b4c30d1968
    - 1ec9eff863dc4418d1498bc3d904899d
    - 2a0834560ed3770fc33d7a42f8229722
    - 2a385fe7bed9899d77d05cb8e302d557
    - 57b9c56ef97a7ada98257b23577bf5e3
    - 60a0f58001ea7be538cd42b651924cc7
    - 6b49f24d5d5b49127476bc385565f8b0
    - 8da3fe3664d81226b0fb2a50a0537d4f
  selection_name:
    Image|endswith:
    - \rockstargamescrashfixer.exe
    - \svchost.exe
    - \steam.exe
    - \licensechecker.exe
    CommandLine|contains: '%TEMP%'
  condition: selection_hash or selection_name
falsepositives:
- Legitimate game installers (Steam, Epic Games) may use svchost.exe or steam.exe names in temp folders
  during updates.
- System utility scripts named licensechecker.exe used by enterprise management tools.
