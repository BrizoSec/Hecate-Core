description: Detects DNS queries for known malicious domains and paths associated with staged execution
  of PowerShell scripts and proxy-related binaries, indicative of adversary infrastructure abuse for proxy
  node deployment. This behavior aligns with T1059.001 (PowerShell), T1012 (Exploitation for Privilege
  Escalation), T1684 (Data Encrypted for Impact), T1027.015 (Remote Access Tools), and T1036 (Masquerading),
  observed in campaigns targeting Korean users.
