detection:
  selection:
    ParentImage|endswith: \powershell.exe
    CommandLine|contains:
    - http://103.86.86.244:800/Gateway/r.Zip
    - http://103.86.86.244:800/V/deploy.Ps1
    - http://103.86.86.244:800/Gateway/deploy_silent1.Ps1
    - http://103.86.86.244/gateway/ag.exe
    - http://103.86.86.244/gateway/conima.exe
    - http://103.86.86.244:800/c/
    - http://103.86.86.244:800/c/config.example.json
    - http://103.86.86.244:800/c/ddengine64.dll
  filter:
    CommandLine|contains: ' -NoProfile -ExecutionPolicy Bypass'
  condition: selection and not filter
falsepositives:
- Automated deployment scripts using PowerShell with similar URLs in test environments
- Administrative scripting with legitimate PowerShell downloads from internal sources
