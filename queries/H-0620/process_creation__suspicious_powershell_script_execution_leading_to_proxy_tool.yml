title: Suspicious PowerShell Script Execution Leading to Proxy Tool Deployment
id: 40f76c84-2451-4b56-a0f5-c52a0518ac45
status: experimental
description: Detects staged execution of PowerShell scripts from known malicious infrastructure that download
  and execute proxy-related binaries (e.g., Netch-gateway, CCProxy, SoftEther VPN), indicative of compromised
  systems being repurposed as proxy nodes. This behavior aligns with observed campaigns targeting Korean
  users and supports early detection of post-compromise infrastructure abuse.
