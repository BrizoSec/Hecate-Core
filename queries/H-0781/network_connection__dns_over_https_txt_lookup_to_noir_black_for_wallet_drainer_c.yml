hunt_id: H-0781
hecate_review:
  verdict: revise
  issues:
  - The rule uses `DestinationHostname|contains` for 'noir.black', which is imprecise and may match subdomains
    like 'www.noir.black' or unrelated domains containing the string. The hypothesis and passages specify
    lookups *against* noir.black (specifically r.noir.black), implying exact domain matching or wildcard
    *.noir.black is more appropriate.
  - 'The rule includes ''render-984.pages.dev'' and ''listchoiseopenleaderboardseptember.netlify.app''
    in the `selection_domain` filter. According to the hypothesis and passages, these are *staging URLs*
    resolved dynamically via DNS TXT records from noir.black, not the primary C2 domain being queried
    via DoH. Including them as direct destination hostnames for the DoH query creates a logical error:
    the client queries noir.black (or r.noir.black) to get these domains; it does not necessarily query
    these domains *via* the specific DoH endpoint 1.1.1.1 in the same initial C2 handshake context described.
    More critically, the hypothesis states adversaries use DNS-over-HTTPS TXT record lookups *against
    noir.black*. The rule filters for traffic where the destination hostname contains any of those three
    strings AND the IP is 1.1.1.1. This misses the core behavior: querying noir.black via DoH. It also
    incorrectly implies that traffic to render-984.pages.dev or listchoiseopenleaderboardseptember.netlify.app
    *via* 1.1.1.1 is part of the specific ''DNS-over-HTTPS TXT Lookup to Noir Black'' event, which is
    misleading. The C2 mechanism is the query to noir.black; the other domains are results.'
  - 'The rule does not explicitly filter for TXT record type (`record_type: txt`), which is a critical
    part of the hypothesis (''DNS-over-HTTPS TXT record lookups''). Without this, it detects any DoH traffic
    to those domains, significantly increasing false positives and deviating from the specific abuse vector
    described.'
