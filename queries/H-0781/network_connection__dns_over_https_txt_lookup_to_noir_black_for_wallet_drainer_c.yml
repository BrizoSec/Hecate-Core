title: DNS-over-HTTPS TXT Lookup to Noir Black for Wallet Drainer Config
id: 405b64da-9060-418a-b380-a5e150cc42c9
status: experimental
description: Detects DNS-over-HTTPS (DoH) traffic querying the 'noir.black' domain, specifically targeting
  TXT records which are commonly abused by cryptocurrency wallet drainers like 'Noir' to dynamically resolve
  staging URLs and C2 infrastructure. This behavior bypasses traditional DNS logging by using encrypted
  resolvers such as Cloudflare (1.1.1.1).
references:
- https://www.infoblox.com/blog/threat-intelligence/when-a-wallet-drainer-asks-dns-where-to-go/
author: hecate (auto-generated draft - requires analyst review)
date: '2026-10-15'
tags:
- attack.t1071.002
- attack.t1566
logsource:
  category: network_connection
detection:
  selection_ip:
    DestinationIp|cidr: 1.1.1.1/32
  selection_domain:
    DestinationHostname|contains:
    - noir.black
    - render-984.pages.dev
    - listchoiseopenleaderboardseptember.netlify.app
  condition: selection_ip and selection_domain
falsepositives:
- Legitimate DNS-over-HTTPS usage to Cloudflare
- Internal services resolving via public resolvers
