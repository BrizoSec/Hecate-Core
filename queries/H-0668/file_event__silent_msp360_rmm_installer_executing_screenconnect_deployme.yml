title: Silent MSP360 RMM Installer Executing ScreenConnect Deployment
id: 795a0561-8b76-45e2-85b4-606449340d0e
status: experimental
description: Detects the execution of an MSP360 RMM installer with silent arguments followed by the creation
  of a ScreenConnect executable file. This behavior indicates the abuse of legitimate MSP360 tools to
  silently deploy ScreenConnect for redundant persistent remote access, bypassing standard security controls.
references:
- https://www.microsoft.com/en-us/security/blog/2026/09/29/phishing-abuses-rmm-tools-persistent-access/
author: hecate (auto-generated draft - requires analyst review)
date: '2026-10-08'
tags:
- attack.t1566
logsource:
  category: file_event
  product: windows
detection:
  selection_msp360_silent:
    Image|contains: msp360
    Image|endswith: .exe
  selection_screenconnect_exe:
    TargetFilename|contains: screenconnect
    TargetFilename|endswith: .exe
  condition: selection_msp360_silent and selection_screenconnect_exe
falsepositives:
- Legitimate MSP360 RMM updates or installations that bundle ScreenConnect
- Authorized IT administration deploying remote access tools via MSP360
- Standard application installation processes creating executable artifacts
level: medium
hunt_id: H-0668
hecate_review:
  verdict: keep
