title: DLL Side-loading via Python DLLs in Non-Standard Paths
id: bec92323-85cb-49ee-aa17-e4ea04a49ead
status: experimental
description: Detects the creation or modification of files named python37.dll or python36.dll outside
  of standard system directories. This behavior is indicative of DLL side-loading attacks where adversaries
  place malicious DLLs with legitimate names to hijack execution flow, commonly used by infostealers like
  Remus and Vidar.
references:
- https://asec.ahnlab.com/en/95519/
author: hecate (auto-generated draft - requires analyst review)
date: '2026-10-12'
tags:
- attack.t1574.001
logsource:
  category: file_event
  product: windows
detection:
  selection:
    TargetFilename|contains: python36.dll
  condition: selection
falsepositives:
- Legitimate Python installations updating DLLs in their own directories
- Software development environments compiling or installing Python libraries
- Game engines like RenPy bundling Python runtimes in application folders
level: high
hunt_id: H-0717
