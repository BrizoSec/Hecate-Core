title: DLL Side-Loading via Python DLLs from Non-System Paths
id: c22f45c1-88ad-4a39-ad4a-c4a1cb1774eb
status: experimental
description: Detects the loading of python37.dll or python36.dll from non-standard directories, indicating
  potential DLL side-loading attacks where adversaries place malicious DLLs alongside legitimate executables
  to hijack library resolution. This technique is commonly used by infostealers like Remus and Vidar to
  evade hash-based detection.
references:
- https://asec.ahnlab.com/en/95519/
author: hecate (auto-generated draft - requires analyst review)
date: '2026-10-12'
tags:
- attack.t1574.001
logsource:
  category: image_load
  product: windows
detection:
  selection:
    ImageLoaded|contains: python37.dll
    Image|startswith: \\
  condition: selection
falsepositives:
- Legitimate Python applications installed in custom directories (e.g., C:\Python39, D:\DevTools\python)
- Virtual environment scripts loading local DLLs
- Game engines or IDEs bundling Python interpreters in non-standard paths
level: high
hunt_id: H-0717
hecate_review:
  verdict: keep
