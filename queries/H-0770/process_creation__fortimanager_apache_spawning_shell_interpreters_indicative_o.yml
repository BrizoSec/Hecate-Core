title: FortiManager Apache Spawning Shell Interpreters Indicative of CVE-2024-47575 Exploitation
id: d54aab77-bc76-48fc-b132-28a2fae45dad
status: experimental
description: Detects the exploitation of CVE-2024-47575 in FortiManager where the Apache web server process
  (httpd) spawns a shell interpreter (sh, bash, dash, ash). This behavior is highly indicative of remote
  code execution via the management interface, potentially deploying memory-resident implants like PEERSTITCH
  or establishing reverse shells.
references:
- https://unit42.paloaltonetworks.com/fortimanager-cve-2024-47575-peerstitch-malware/
author: hecate (auto-generated draft - requires analyst review)
date: '2026-10-15'
tags:
- attack.t1040
logsource:
  category: process_creation
detection:
  selection_apache_parent:
    ParentImage|endswith: /usr/local/apache/bin/httpd
  suspicious_shell_child:
    CommandLine|contains: -c
  condition: selection_apache_parent and suspicious_shell_child
falsepositives:
- Legitimate FortiManager internal maintenance scripts or log rotation processes spawned by the web server.
- Automated health checks or monitoring agents that invoke shell commands for status reporting.
level: high
hunt_id: H-0770
