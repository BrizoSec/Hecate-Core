title: Suspicious Process Creation with Elevated User Privileges
id: 58e9c57e-0aed-4d23-b1aa-526b13148cec
status: experimental
description: Detects process creations initiated by users with elevated privileges, which could indicate
  an adversary attempting to evade detection or exploit compromised accounts.
references:
- https://www.huntress.com/blog/managed-itdr-dashboard-redesigned
author: hecate (auto-generated draft - requires analyst review)
date: '2026-09-15'
tags:
- attack.t1059.003
logsource:
  category: process_creation
detection:
  selection:
    User|contains: \domain\admin
  filter:
    CommandLine|contains: powershell.exe -ExecutionPolicy Bypass
  condition: selection and not filter
falsepositives:
- Administrative tasks performed by legitimate administrators
level: medium
hunt_id: H-0041
