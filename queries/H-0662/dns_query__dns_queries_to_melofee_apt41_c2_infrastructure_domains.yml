title: DNS Queries to Melofee APT41 C2 Infrastructure Domains
id: 88defc20-2ea4-43e0-8489-47d3fa7d3ed0
status: experimental
description: Detects DNS queries for domains associated with the Melofee implant attributed to APT41.
  These domains are used for command and control communications, often impersonating legitimate services
  like Windows Update or Microsoft Defender to evade detection.
references:
- https://www.stormshield.com/news/cti-melofee-linux-implant-and-new-variants/
author: hecate (auto-generated draft - requires analyst review)
date: '2026-10-08'
tags:
- attack.t1014
- attack.t1573
- attack.t1684.001
logsource:
  category: dns_query
detection:
  selection:
    QueryName|contains:
    - windefender.net
    - microsoftupdates.top
    - amzaonaws.org
    - microupdate.me
    - microupdate.top
    - windowsupdates.us
  condition: selection
falsepositives:
- Legitimate DNS queries for similarly named domains (e.g., windowsupdate.com, microsoft.com)
- Typosquatting or phishing campaigns targeting other organizations
- Internal domain names matching these patterns in lab environments
