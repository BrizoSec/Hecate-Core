hecate_review:
  verdict: revise
  issues:
  - The hypothesis specifically focuses on 'kernel rootkits' and 'modular Linux binaries with hot-loadable
    plugins' as the primary mechanism for stealth and persistence. The drafted rule only detects DNS queries
    to C2 domains, which addresses the 'command and control' aspect but completely ignores the core technical
    differentiators (kernel rootkit, modular architecture) highlighted in the hypothesis.
  - The rule is too narrow relative to the hypothesis. While it detects one indicator of the threat, it
    fails to detect the specific behaviors (kernel-level evasion, dynamic module loading) that define
    the adversary's TTPs in the provided text.
