title: Detection of LLM Prompt Aggregation via Temp File Creation
id: 23eeb4d8-54d5-4aed-bf06-72aa6fe76f49
status: experimental
description: Detects the creation of temporary files in system temp directories, which is a common behavior
  for adversaries aggregating multi-step prompts or staging obfuscated content before sending it to an
  LLM endpoint. This aligns with T1027.010 (Obfuscated Files or Information) where data is prepared for
  exfiltration or injection.
references:
- https://www.crowdstrike.com/en-us/blog/how-attackers-can-bypass-llm-safety-classifiers/
author: hecate (auto-generated draft - requires analyst review)
date: '2026-10-09'
tags:
- attack.t1027.010
logsource:
  category: file_event
  product: windows
detection:
  selection:
    TargetFilename|contains: /tmp/
  condition: selection
falsepositives:
