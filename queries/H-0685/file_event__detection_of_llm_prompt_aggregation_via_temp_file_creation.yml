hecate_review:
  verdict: reject
  issues:
  - The rule relies on detecting file creation in /tmp/, which is a Linux path, while the logsource specifies
    'windows'. This is technically invalid for Windows logs.
  - The provided source passages do not describe or support the specific behavior of creating temporary
    files to aggregate prompts. The hypothesis mentions 'multi-step prompt aggregation' but does not specify
    the mechanism (e.g., file creation). The rule invents a detection method not grounded in the provided
    text.
  unverified_contradiction: The logsource specifies 'windows', but the detection logic looks for '/tmp/',
    which is a Unix/Linux path, not a standard Windows temporary directory path. Furthermore, the passages
    do not mention file creation as the method of aggregation.
