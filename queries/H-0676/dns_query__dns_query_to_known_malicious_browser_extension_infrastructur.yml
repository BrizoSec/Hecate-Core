title: DNS Query to Known Malicious Browser Extension Infrastructure
id: e4440dfc-d4fc-4f00-abad-2486acf33c7e
status: experimental
description: Detects DNS lookups for domains associated with the 'Twitch Enhanced Viewer | JeetBot' malicious
  browser extension. These domains are used by the extension to intercept authenticated session tokens
  and exfiltrate them via proxied network requests, leading to unauthorized account access.
references:
- https://socket.dev/blog/malicious-twitch-browser-extension
author: hecate (auto-generated draft - requires analyst review)
date: '2026-10-09'
tags:
- attack.t1539
- attack.t1550.004
logsource:
  category: dns_query
detection:
  selection:
    QueryName|contains:
    - alexue4.dev
    - morphilina.me
    - jeetbot.cc
    - drisnya.online
    - enhanced.jeetbot.cc
    - ext-03.jeetbot.cc
    - proxy.morphilina.me
    - ext-styles.jeetbot.cc
    - api.jeetbot.cc
    - img.drisnya.online
    - thebeholder-proxy.deno.dev
    - proxy.thebeholder.deno.net
    - enhanced-1.jeetbot.cc
  condition: selection
falsepositives:
- Legitimate use of Deno hosting services (deno.dev) for legitimate web applications
- Users installing the legitimate 'Twitch Enhanced Viewer' extension if it exists and uses similar naming
  conventions (though intelligence indicates these specific domains are malicious)
- CDN or proxy services that may share infrastructure with the listed domains
level: high
