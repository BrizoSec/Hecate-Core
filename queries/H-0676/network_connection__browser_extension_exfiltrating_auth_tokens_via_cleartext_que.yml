title: Browser Extension Exfiltrating Auth Tokens via Cleartext Query Parameters
id: 0cbecf2e-c002-40bc-a2ff-6cc6feabff3a
status: experimental
description: Detects browser processes connecting to known malicious proxy infrastructure associated with
  the 'Twitch Enhanced Viewer | JeetBot' extension. Specifically targets the exfiltration of OAuth session
  tokens via cleartext 'auth=' query parameters in HTTP requests, indicating active credential theft.
