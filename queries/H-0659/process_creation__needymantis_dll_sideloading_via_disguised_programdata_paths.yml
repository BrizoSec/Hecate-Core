title: NeedyMantis DLL Sideloading via Disguised ProgramData Paths
id: cec3c8e6-acd0-470b-8a06-a3d838216ba2
status: experimental
description: Detects the execution of processes with command lines or images referencing specific malicious
  DLL names located in non-standard subdirectories of %ProgramData% (e.g., USOShared, VIM, office). This
  behavior is indicative of the NeedyMantis framework's DLL sideloading technique used by Storm-3069 to
  establish persistent C2 channels.
references:
- https://www.microsoft.com/en-us/security/blog/2026/09/28/needymantis-unpacking-a-post-compromise-malware-family-used-in-targeted-operations/
author: hecate (auto-generated draft - requires analyst review)
date: '2026-10-08'
tags:
- attack.t1027
- attack.t1036
- attack.t1059.001
- attack.t1140
logsource:
  category: process_creation
  product: windows
detection:
  selection_dll_sideloading:
    CommandLine|endswith: WinSparkle.dll
  condition: selection_dll_sideloading
falsepositives:
- Legitimate software update mechanisms using WinSparkle or libcurl in standard directories
- Enterprise management tools placing DLLs in custom ProgramData folders for configuration
level: high
hunt_id: H-0659
hecate_review:
  verdict: revise
  issues:
  - The rule relies solely on the CommandLine ending with 'WinSparkle.dll', which is insufficient to detect
    DLL sideloading. Sideloading occurs when a legitimate host process loads a malicious DLL; the command
    line of the host process will not end with the DLL name (e.g., it might be 'C:\Program Files\App\app.exe').
  - 'The rule fails to detect the core behavior described in the hypothesis and passages: the use of disguised
    paths within %ProgramData% (e.g., USOShared, VIM). The current detection logic ignores the file path
    entirely.'
  - The description claims to detect 'specific malicious DLL names located in non-standard subdirectories',
    but the Sigma rule's `detection` section does not include any condition checking the Image or CommandLine
    for these paths.
  unverified_contradiction: The rule describes detecting DLLs in specific %ProgramData% subdirectories,
    but the detection logic only checks if the command line ends with 'WinSparkle.dll', which contradicts
    the mechanism of DLL sideloading where the executable name is not the DLL name.
