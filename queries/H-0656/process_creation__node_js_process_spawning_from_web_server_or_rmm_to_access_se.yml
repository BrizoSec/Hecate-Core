title: Node.js Process Spawning from Web Server or RMM to Access Sensitive Configs
id: 4eaaf7be-2a68-43aa-8c79-b0097f7bc9f4
status: experimental
description: Detects a Node.js process spawned by a web server (e.g., nginx, httpd) or Remote Monitoring
  and Management tool (SimpleHelp), which is an unusual parent-child relationship often used by loaders
  like TaskWeaver to execute credential harvesting scripts. This behavior aligns with the Djinn Stealer
  TTP of using legitimate infrastructure processes to deploy malicious payloads.
references:
- https://blackpointcyber.com/blog/threat-snapshot-djinn-stealer/
author: hecate (auto-generated draft - requires analyst review)
date: '2026-10-07'
tags:
- attack.t1036
- attack.t1059.007
logsource:
  category: process_creation
detection:
  selection_parent_webserver_rmm:
    ParentImage|endswith: \nginx.exe
    CommandLine|contains: node
  selection_parent_simplehelp:
    ParentImage|endswith: \SimpleHelp.exe
    CommandLine|contains: node
  condition: selection_parent_webserver_rmm or selection_parent_simplehelp
falsepositives:
- Legitimate deployment scripts executed by web servers
- Automated maintenance tasks run by RMM tools
level: high
hunt_id: H-0656
hecate_review:
  verdict: keep
