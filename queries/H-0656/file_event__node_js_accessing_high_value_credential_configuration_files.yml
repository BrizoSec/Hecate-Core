title: Node.js Accessing High-Value Credential Configuration Files
id: 6bbb91c1-8e6b-4256-aae0-032ccaaed8e1
status: experimental
description: Detects Node.js processes reading configuration files from directories associated with AI
  assistants (Claude, Gemini), cloud providers (AWS), source control (Git), and SSH. This behavior aligns
  with the Djinn Stealer threat which uses Node.js to harvest credentials from these specific high-value
  locations before exfiltration.
references:
- https://blackpointcyber.com/blog/threat-snapshot-djinn-stealer/
author: hecate (auto-generated draft - requires analyst review)
date: '2026-10-07'
tags:
- attack.t1027
- attack.t1036
logsource:
  category: file_event
detection:
  selection_node:
    Image|endswith: /node
  selection_configs:
    TargetFilename|contains: .ssh
  condition: selection_node and selection_configs
falsepositives:
- Legitimate development tools accessing configuration files
- IDEs or linters reading project settings
- Cloud CLI tools updating local cache files
level: high
hunt_id: H-0656
hecate_review:
  verdict: revise
  issues:
  - The rule detects Node.js processes reading files containing '.ssh', which only covers SSH credentials.
    The hypothesis and passages explicitly state the stealer harvests data from 'cloud platforms, source
    control systems, package registries, infrastructure tooling, AI development assistants' in addition
    to SSH. The rule is too narrow and misses the majority of the targeted high-value locations described.
  - 'The rule uses a generic detection for Node.js (''Image|endswith: /node'') which may not be specific
    enough given the context of ''Node.js runtime execution'' as a loader, though this is less critical
    than the scope issue.'
