title: Detection of GOST Tunnel and Rclone Executables in PerfLogs Directory
id: 5442e697-d60c-473a-b47d-7bb148a5c927
status: experimental
description: Detects the creation of files named svchost.exe in C:\PerfLogs\temp (disguised GOST tunneling
  tool) or RClone.exe, which are indicators of Akira ransomware group activity involving data exfiltration
  and potential persistence.
references:
- https://www.huntress.com/blog/mapping-akira-ransomware-attack
author: hecate (auto-generated draft - requires analyst review)
date: '2026-10-14'
tags:
- attack.t1021.001
- attack.t1059.001
logsource:
  category: file_event
  product: windows
detection:
  selection_gost:
    TargetFilename|endswith: \svchost.exe
  selection_rclone:
    TargetFilename|endswith: \RClone.exe
  condition: selection_gost or selection_rclone
falsepositives:
- Legitimate system updates or administrative tools using similar names in non-standard directories
- Custom internal scripts deploying binaries to PerfLogs for temporary storage
level: high
hunt_id: H-0763
hecate_review:
  verdict: revise
  issues:
  - The rule uses 'endswith' for filenames which is overly broad and prone to false positives (e.g., detecting
    legitimate files ending in .exe). The source specifically identifies the path C:\PerfLogs\temp\svchost.exe,
    so the detection should be more specific to the full path or directory.
  - The rule detects 'RClone.exe' but the source passage [2] states the actor launched 'RClone' from a
    specific path. While Rclone is often a single binary, relying on the exact filename 'RClone.exe' might
    miss variations (e.g., rclone.exe) not explicitly ruled out, though less critical than the svchost
    issue.
  - 'The description mentions ''disguised GOST tunneling tool'' but the rule only checks for the filename
    svchost.exe. The source [4] links C:\storage\win.exe to the GOST Tunnel and C:\PerfLogs\temp\svchost.exe
    to the Ransomware EXE (or potentially the disguised tool depending on interpretation, but passage
    4 explicitly maps svchost.exe SHA256 to ''Ransomware EXE'' in the IOC table, while win.exe is linked
    to GOST). Wait, let''s re-read Passage 4 carefully: ''C:\storage\win.exe ... Ransomware EXE'' and
    ''C:\PerfLogs\temp\svchost.exe ... [SHA256]''. Actually, Passage 4 lists two IOCs. One is C:\storage\win.exe
    (Ransomware). The other is C:\PerfLogs\temp\svchost.exe. It does not explicitly label svchost.exe
    as the GOST tool in the IOC table, but Passage 1 says ''deployed a GOST tunneling tool'' and Passage
    2 says ''launched RClone''. Passage 8 tags include ''gost tunnel''. The rule assumes svchost.exe is
    the GOST tool. This is an inference not explicitly supported by the text which associates win.exe
    with ransomware and doesn''t explicitly name the GOST executable filename, only the C2 IP. However,
    the bigger issue is that the rule detects *creation* (file_event) whereas the hypothesis mentions
    *use* (tunneling/exfiltration). File creation is a precursor, not the behavior itself. But more importantly,
    the rule title says ''Detection of GOST Tunnel... Executables'' but the detection logic is just file
    creation. This is acceptable for a hunt rule, but the mapping of svchost.exe to GOST is weak based
    on the text provided which links win.exe to ransomware and doesn''t explicitly name the GOST binary
    filename, only its C2 IP.'
  - 'Most critically: The source passage [4] lists ''C:\PerfLogs\temp\svchost.exe'' with a specific SHA256.
    The rule detects ANY file ending in \svchost.exe in PerfLogs. This is a significant deviation from
    the specific indicator provided.'
