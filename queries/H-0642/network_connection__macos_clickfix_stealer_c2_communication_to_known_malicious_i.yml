title: macOS ClickFix Stealer C2 Communication to Known Malicious Infrastructure
id: 74e077f9-ac36-46c6-b97b-b6eb8f6e57f9
status: experimental
description: Detects network connections from macOS endpoints to known Command and Control (C2) infrastructure
  associated with the ClickFix social engineering campaign. This campaign uses social engineering to trick
  users into executing malicious Bash commands that deploy Go-based Mach-O stealers via Background Task
  Management, aiming to steal cryptocurrency and credentials. The rule targets the specific IP addresses
  identified in threat intelligence reports as part of this campaign's infrastructure.
