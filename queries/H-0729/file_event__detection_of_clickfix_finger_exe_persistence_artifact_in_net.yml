title: Detection of ClickFix Finger.exe Persistence Artifact in .NET GAC Directory
id: be94ccbe-0440-4a26-82b3-bb2c25779aab
status: experimental
description: Detects the creation of 'finger.exe' within the System.Management assembly directory, a known
  persistence mechanism used by adversaries leveraging ClickFix and CMSTPLUA abuse to deploy RemotePanel.
  This file event indicates the placement of the malicious payload masquerading as a legitimate .NET component.
references:
- https://blackpointcyber.com/blog/remotepanel-and-boundsiphon-a-dual-payload-toolkit-for-persistent-access-and-browser-theft/
author: hecate (auto-generated draft - requires analyst review)
date: '2026-10-12'
tags:
- attack.t1027
- attack.t1053.005
logsource:
  category: file_event
  product: windows
detection:
  selection:
    TargetFilename|contains: \Microsoft.NET\assembly\GAC_MSIL\System.Management\
    Image|endswith: \finger.exe
  condition: selection
falsepositives:
- Legitimate .NET Framework updates or repairs writing to GAC directories
- Administrative scripts managing .NET assemblies
level: high
hunt_id: H-0729
hecate_review:
  verdict: keep
