hecate_review:
  verdict: revise
  issues:
  - The rule title and description focus on 'JSP Web Shell Network Beaconing' and 'persistence via web-based
    backdoors', whereas the hypothesis specifically requires detecting 'timestamp manipulation' and 'legitimate
    naming conventions for systemd services'.
  - The provided source passages describe JSP web shells, reverse shells, privilege escalation, and command
    injection (CVE-2026-73570), but do not mention systemd services, timestamp manipulation, or legitimate
    naming conventions for persistence.
  - The rule detects network connections initiated by the 'zimbra' user, which aligns with the passage
    describing command execution as the zimbra service account, but fails to address the specific persistence
    mechanisms outlined in the hypothesis.
