title: Registry Persistence via Scheduled Task UpdateCheck
id: 29ef397d-8492-4aac-a98c-e69492f08a5b
status: experimental
description: Detects the creation of a scheduled task named 'UpdateCheck' in the registry, which is a
  common persistence mechanism used by malware like SocGholish to maintain access after initial compromise.
  This rule targets the specific registry key modification associated with schtasks.exe creating this
  task.
references: []
author: hecate (auto-generated draft - requires analyst review)
date: '2026-10-07'
tags:
- attack.t1053.005
logsource:
  category: registry_event
  product: windows
detection:
  selection:
    TargetObject|contains: \Microsoft\Windows\CurrentVersion\Run\UpdateCheck
  condition: selection
falsepositives:
- Legitimate software installers or updaters that use the Run key for persistence
- System utilities configuring scheduled maintenance tasks
level: high
hunt_id: H-0644
hecate_review:
  verdict: revise
  issues:
  - The rule detects modifications to the 'Run' registry key (HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\Run),
    but the hypothesis specifically describes 'scheduled task creation'. These are distinct persistence
    mechanisms. The rule title mentions 'Scheduled Task' but the detection logic targets a different artifact,
    making it off-target for the specific behavior described in the hypothesis.
