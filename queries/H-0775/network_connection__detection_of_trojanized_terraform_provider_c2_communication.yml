detection:
  selection_domains:
    DestinationHostname|contains:
    - hashicorp-terraform.io
    - arusupport-region1-webhook.online
    - supportaru.serveftp.com
  selection_malicious:
    DestinationHostname|contains:
    - arusupport-region1-webhook.online
    - hashicorp-terraform.io
    - supportaru.serveftp.com
  condition: selection_domains or selection_malicious
falsepositives:
- Legitimate Terraform provider updates from official HashiCorp domains
- Internal proxying of legitimate web traffic
