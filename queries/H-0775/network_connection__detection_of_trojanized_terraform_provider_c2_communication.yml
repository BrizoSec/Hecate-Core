title: Detection of Trojanized Terraform Provider C2 Communication
id: d2fb7aae-f9ce-42bf-a41a-7d0843404755
status: experimental
description: Detects network connections to known lookalike HashiCorp domains and malicious infrastructure
  used by the TraderTraitor group to deliver trojanized Terraform providers. This behavior indicates a
  supply-chain attack targeting Web3 developers, where legitimate-looking tooling is compromised to download
  persistent backdoors.
references:
- https://www.zscaler.com/blogs/security-research/suspected-tradertraitor-group-uses-trojanized-terraform-provider-deliver
author: hecate (auto-generated draft - requires analyst review)
date: '2026-10-15'
tags:
- attack.t1071.001
- attack.t1105
logsource:
