title: Detection of WeaselBiscuit Keyboard Monitor DLL Load
id: 03e2ab02-6a48-4e05-bdb0-5eb502e7512e
status: experimental
description: Detects the loading of a malicious dynamic link library associated with the WeaselBiscuit
  infostealer. This rule targets the specific file path used by the detached Node.js loader to execute
  its keylogging and data exfiltration components, which is distinct from legitimate system or application
  DLLs.
references:
- https://opensourcemalware.com/blog/introducing-weaselbiscuit
author: hecate (auto-generated draft - requires analyst review)
date: '2026-10-11'
tags:
- attack.t1620
logsource:
  category: image_load
  product: windows
detection:
  selection:
    ImageLoaded|endswith: \kb-monitor\keyboard-monitor-*.dll
  condition: selection
falsepositives:
- Legitimate keyboard monitoring utilities or accessibility tools installed by the user
- Custom enterprise keyloggers for compliance auditing
level: high
hunt_id: H-0707
hecate_review:
  verdict: revise
  issues:
  - The rule targets DLL loading (ImageLoaded), but the source passages explicitly describe the malware
    as a JavaScript/Node.js infostealer that executes via Node processes and PowerShell scripts, with
    no mention of DLL injection or loading.
  - Passage [10] references '.pid files' and 'keyboard-monitor-*.ps1', not DLLs. The rule incorrectly
    assumes a Windows DLL artifact for a primarily script-based (JS/Node) threat architecture described
    in the text.
  unverified_contradiction: The rule detects a DLL load, but the report describes a JavaScript/Node.js
    based stealer using PowerShell and .pid files, not DLLs.
