hecate_review:
  verdict: revise
  issues:
  - The rule detects DNS queries containing an IP address, which is technically invalid behavior (DNS
    queries use hostnames/domains, not IPs). The hypothesis and passages describe HTTP beacons to an IP,
    implying the resolution happens via standard DNS lookups of a domain or direct connection if the IP
    is hardcoded. A valid detection would target DNS queries for the domains used in the Npoint resolvers
    (e.g., api.npoint.io) or network connections to the IP.
  - The rule title and description imply detecting 'DNS Query to ... IP Address', which is a category
    error. The hypothesis states communication is via HTTP polling to port 8787, not specifically DNS
    resolution of that IP as a primary indicator in this context (though DNS would be involved if it were
    a domain). The passages list Npoint URLs (domains) as the resolvers for configuration and payloads,
    making those domains more relevant for DNS-based detection than the IP itself in a 'QueryName' field.
