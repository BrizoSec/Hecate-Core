title: Detection of WeaselBiscuit Keyboard Monitor PowerShell Execution
id: a1edd0e2-40aa-4b7c-ac15-65bf7b90b512
status: experimental
description: Detects the execution of a malicious PowerShell script associated with the WeaselBiscuit
  infostealer. This rule targets the specific file path pattern used by the malware to deploy its keyboard
  monitoring component, which is often delivered via npm supply chain compromise and executed in memory
  or as a detached loader.
references:
- https://opensourcemalware.com/blog/introducing-weaselbiscuit
author: hecate (auto-generated draft - requires analyst review)
date: '2026-10-11'
tags:
- attack.t1059.001
- attack.t1059.007
- attack.t1140
- attack.t1620
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    CommandLine|endswith: \kb-monitor\keyboard-monitor-*.ps1
  condition: selection
falsepositives:
- Legitimate keyboard monitoring or accessibility tools
- System administration scripts using similar naming conventions
level: high
hunt_id: H-0707
hecate_review:
  verdict: keep
