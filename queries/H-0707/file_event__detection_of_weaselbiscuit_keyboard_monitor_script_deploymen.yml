title: Detection of WeaselBiscuit Keyboard Monitor Script Deployment
id: 5d2c9713-2fae-47aa-8ca6-4936aa751890
status: experimental
description: Detects the creation of malicious PowerShell scripts associated with the WeaselBiscuit infostealer.
  These scripts, typically named 'keyboard-monitor-*.ps1', are deployed to the %TEMP% directory to capture
  keystrokes and exfiltrate Chrome extension storage data via HTTP polling.
references:
- https://opensourcemalware.com/blog/introducing-weaselbiscuit
author: hecate (auto-generated draft - requires analyst review)
date: '2026-10-11'
tags:
- attack.t1113
- attack.t1571
logsource:
  category: file_event
  product: windows
detection:
  selection:
    TargetFilename|endswith: \kb-monitor\keyboard-monitor-*.ps1
  condition: selection
falsepositives:
- Legitimate keyboard logging utilities for accessibility or debugging
- Automated build scripts generating temporary monitoring files
level: high
hunt_id: H-0707
hecate_review:
  verdict: keep
