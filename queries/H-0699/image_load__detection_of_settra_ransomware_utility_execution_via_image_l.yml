title: Detection of Settra Ransomware Utility Execution via Image Load
id: 9880924d-3008-44bf-a84a-cad13ae57616
status: experimental
description: Detects the loading of specific system utilities (diskpart, cipher) and suspicious process
  images (mvtcs.exe) associated with the Settra ransomware variant. This behavior indicates an attempt
  to disable recovery environments, wipe free space, or maintain persistence through renamed RMM agents.
references:
- https://www.huntress.com/blog/new-settra-ransomware-variant
author: hecate (auto-generated draft - requires analyst review)
date: '2026-10-11'
tags:
- attack.t1574.001
logsource:
  category: image_load
  product: windows
detection:
  selection_suspicious_image:
    ImageLoaded|endswith: \mvtcs.exe
  selection_diskpart_utility:
    ImageLoaded|endswith: \diskpart.exe
  selection_cipher_utility:
    ImageLoaded|endswith: \cipher.exe
  condition: selection_suspicious_image or selection_diskpart_utility or selection_cipher_utility
falsepositives:
- Legitimate RMM software installation or management
- System administrator performing disk maintenance or recovery partition cleanup
- Security tools utilizing diskpart or cipher for secure deletion
level: high
hunt_id: H-0699
hecate_review:
  verdict: keep
