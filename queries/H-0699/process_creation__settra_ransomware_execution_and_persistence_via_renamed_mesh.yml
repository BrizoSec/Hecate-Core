title: Settra Ransomware Execution and Persistence via Renamed MeshAgent
id: 23feafa8-746d-4b1e-a0ae-8d0fadaf4084
status: experimental
description: Detects the execution of ransomware components located in C:\Perflogs and the use of system
  utilities to disable recovery environments, often associated with Settra ransomware variants utilizing
  renamed MeshAgent binaries for persistence.
references:
- https://www.huntress.com/blog/new-settra-ransomware-variant
author: hecate (auto-generated draft - requires analyst review)
date: '2026-10-11'
tags:
- attack.t1059.003
- attack.t1190
logsource:
  category: process_creation
  product: windows
detection:
  selection_ransomware_exec:
    CommandLine|contains: C:\Perflogs
  selection_recovery_disable:
    CommandLine|contains: reagentc /disable
  selection_diskpart_utility:
    Image|endswith: \diskpart.exe
    ParentImage|endswith: \cmd.exe
  selection_cipher_utility:
    CommandLine|contains: cipher /w:D:\ >nul 2>&1
  condition: (selection_ransomware_exec or selection_recovery_disable) and (selection_diskpart_utility
    or selection_cipher_utility)
falsepositives:
- Legitimate system maintenance scripts
- IT administrative tools performing disk cleanup or recovery configuration
level: high
hunt_id: H-0699
hecate_review:
  verdict: keep
