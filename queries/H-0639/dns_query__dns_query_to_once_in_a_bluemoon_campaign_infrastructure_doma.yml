title: DNS Query to Once in a BlueMoon Campaign Infrastructure Domains
id: 6843166b-e700-485d-835d-ea5d6b772297
status: experimental
description: Detects DNS queries to domains associated with the 'Once in a BlueMoon' campaign (APT31/TA412).
  These domains are used to host malicious Chrome extensions and deliver payloads via legitimate-looking
  update mechanisms like ChromeUpdate.exe. Hunting for these specific domains is critical as they represent
  the initial access vector before credential theft or ShadowPad deployment occurs.
references:
- https://www.proofpoint.com/us/blog/threat-insight/once-bluemoon-multiple-state-aligned-threat-actors-rapidly-adopt-novel-exploit
author: hecate (auto-generated draft - requires analyst review)
date: '2026-10-06'
tags:
- attack.t1071.001
logsource:
  category: dns_query
  product: windows
detection:
  selection:
    QueryName|contains:
    - msbenefit.com
    - attcdn.com
    - secboxes.com
    - airproducts.ink
    - precipart.ink
    - epsilonsystems.net
    - rocketlabusa.ink
    - spectrolab.fit
    - checrity.com
    - aurexdefense.online
  condition: selection
falsepositives:
- Legitimate use of CDN services (attcdn.com)
- Typosquatting or compromised legitimate domains with similar names
- Internal DNS forwarding to external resolvers logging these queries
level: high
