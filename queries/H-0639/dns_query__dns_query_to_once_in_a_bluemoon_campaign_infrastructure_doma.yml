hecate_review:
  verdict: keep
  issues:
  - The rule focuses exclusively on DNS queries to specific domains, whereas the hypothesis describes
    a complex chain involving malicious Chrome extensions, zero-day exploits, credential-stealing backdoors,
    and ShadowPad malware. While the domains are relevant to the 'BlueMoon' campaign mentioned in the
    hypothesis, the rule does not detect the core behaviors described (extension deployment, exploit execution,
    or malware installation). It is a narrow indicator-based detection rather than a behavioral detection
    of the full hypothesis.
