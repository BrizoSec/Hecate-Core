title: Registry Modification to Disable SmartScreen via System Policies
id: 72768f99-b066-4ece-99d2-3ee1f168b716
status: experimental
description: Detects registry modifications associated with disabling Windows SmartScreen, a technique
  used in the Florida healthcare campaign to allow execution of malicious HTA files and silent installation
  of ScreenConnect without user prompts or warnings. Specifically targets the modification of the 'System'
  policy key under HKLM\SOFTWARE\Policies\Microsoft\Windows.
references:
- https://www.menlosecurity.com/blog/from-fake-docusign-to-screenconnect-web-attack-stopped-before-payload-delivery
author: hecate (auto-generated draft - requires analyst review)
date: '2026-10-08'
tags:
- attack.t1112
logsource:
  category: registry_event
  product: windows
detection:
  selection:
    TargetObject|contains: HKLM\SOFTWARE\Policies\Microsoft\Windows\System
  condition: selection
falsepositives:
- Legitimate enterprise configuration management tools (e.g., SCCM, Intune) deploying security baselines
- Local administrator manually configuring SmartScreen settings for testing or specific application compatibility
level: high
hunt_id: H-0664
hecate_review:
  verdict: keep
