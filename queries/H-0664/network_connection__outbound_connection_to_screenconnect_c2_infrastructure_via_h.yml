title: Outbound Connection to ScreenConnect C2 Infrastructure via HTA Delivery Chain
id: 3bdb9eff-0eea-4eee-bc91-e8d895e75113
status: experimental
description: Detects outbound network connections to known Command and Control (C2) infrastructure associated
  with the Florida healthcare targeting campaign. The adversary uses DocuSign impersonation to deliver
  an HTA file, which executes VBScript to download and install ScreenConnect. This rule identifies the
  specific domain used to host the malicious MSI installer payload.
