title: Detection of PolinRider Payload Download via Compromised IDE Task Configuration
id: 6b868752-63c2-40bb-b9cf-7958ec14be9a
status: experimental
description: 'Detects outbound network connections initiated by Visual Studio Code processes that correspond
  to the execution of malicious tasks defined in .vscode/tasks.json. The PolinRider campaign modifies
  these configuration files with ''runOn'': ''folderOpen'' to trigger the download and execution of obfuscated
  JavaScript payloads from specific C2 infrastructure upon repository initialization.'
