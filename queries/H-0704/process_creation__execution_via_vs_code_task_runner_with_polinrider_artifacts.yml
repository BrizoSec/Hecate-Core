title: Execution via VS Code Task Runner with PolinRider Artifacts
id: 6ee2ec97-9e94-47dc-8126-f97466ca54ef
status: experimental
description: 'Detects the execution of scripts triggered by Visual Studio Code''s task runner mechanism,
  specifically looking for the ''runOn'': ''folderOpen'' configuration indicator and associated malicious
  file artifacts like index.php or tailwind.config.js which are part of the PolinRider campaign''s persistence
  strategy.'
references:
- https://socket.dev/blog/polinrider-github-packagist
author: hecate (auto-generated draft - requires analyst review)
date: '2026-10-11'
tags:
- attack.t1059.004
- attack.t1059.006
- attack.t1059.007
- attack.t1204.002
logsource:
  category: process_creation
detection:
  selection_task_trigger:
    CommandLine|contains: '"runOn": "folderOpen"'
  selection_artifacts:
    CommandLine|contains: index.php
  condition: selection_task_trigger and selection_artifacts
falsepositives:
- Legitimate development workflows using VS Code tasks for build, linting, or debugging
- Automated scripts executed via Node.js in CI/CD pipelines
level: high
hunt_id: H-0704
hecate_review:
  verdict: revise
  issues:
  - 'The rule requires both ''runOn'': ''folderOpen'' AND ''index.php'' to be present in the CommandLine
    simultaneously (condition: selection_task_trigger and selection_artifacts). Passage [2] states that
    ''runOn'': ''folderOpen'' is used in .vscode/tasks.json, while Passage [4] states that index.php is
    executed via PHP''s shell_exec. These are distinct vectors described in different contexts; forcing
    them to appear together in a single process creation log line is likely to cause false negatives or
    misinterpretation of the attack chain.'
  - 'The rule targets ''process_creation'' logs for detecting ''.vscode/tasks.json'' content. While VS
    Code tasks can spawn processes, the specific string ''"runOn": "folderOpen"'' is a configuration file
    artifact, not necessarily a command-line argument visible in process creation logs unless explicitly
    passed as an argument to a script, which is not stated in the passages.'
  unverified_contradiction: The rule conflates two separate execution mechanisms described in the report
    into a single detection condition that is unlikely to occur as written.
