title: Redis Cryptomining Persistence via Hidden Cron Jobs and Temp Binaries
id: b5043612-7ba9-4d2d-933c-768f1c370918
status: experimental
description: Detects the creation of hidden files in /etc/cron.d/ and /tmp/ commonly used by adversaries
  to establish persistence for cryptomining campaigns exploiting unauthenticated Redis instances. This
  includes specific artifacts like .redis-miner and .xmrig observed in recent threat intelligence.
references:
- https://hunt.io/blog/redis-cryptomining-botnet-3562-servers
author: hecate (auto-generated draft - requires analyst review)
date: '2026-10-06'
tags:
- attack.t1027
- attack.t1053.003
- attack.t1070.004
- attack.t1105
logsource:
  category: file_event
detection:
  selection_hidden_cron:
    TargetFilename|endswith: .redis-miner
  selection_xmrig_binaries:
    TargetFilename|contains: /tmp/.xmrig
  selection_other_persistence:
    TargetFilename|endswith: /etc/cron.d/xminer
  selection_apt_hook:
    TargetFilename|endswith: /etc/apt/apt.conf.d/99sys-update
  selection_profile_script:
    TargetFilename|endswith: /etc/profile.d/sys-init.sh
  condition: 1 of selection_*
falsepositives:
- Legitimate system administration scripts placed in /etc/cron.d/ or /etc/profile.d/
- Software updates creating temporary files in /tmp
- Backup tools writing to /var/spool/cron/
level: high
hunt_id: H-0634
hecate_review:
  verdict: revise
  issues:
  - The rule includes detection conditions for persistence mechanisms (APT hooks, profile.d scripts) that
    are NOT part of the specific hypothesis or the primary Redis replication attack described in the source
    passages. The hypothesis specifies 'rogue Redis replication to inject malicious cron jobs', but the
    rule broadens scope to include APT and profile.d persistence which are mentioned in the report as
    separate toolkit capabilities (deploy_all.py) rather than the result of the Redis exploitation chain.
  - The rule detects creation of files ending in '/etc/cron.d/xminer' (selection_other_persistence). Passage
    [25] states this is a cron entry created by 'deploy_all.py', which sticks to cron.d, apt.conf.d, and
    profile.d. However, the hypothesis focuses on the Redis replication vector writing to '/etc/cron.d/.redis-miner'
    (Passage [6]). Including '/etc/cron.d/xminer' dilutes the specificity for the stated hypothesis.
  - 'The rule detects files in /tmp/ containing ''.xmrig''. Passage [3] and [7] specify the binary is
    at ''/tmp/.xmrig''. The condition ''contains: /tmp/.xmrig'' is technically correct but overly broad
    if it matches any file path containing that string, whereas the hypothesis implies the specific hidden
    binary. More importantly, the rule mixes the Redis-specific artifact (.redis-miner) with general XMRig
    detection and unrelated persistence methods.'
  unverified_contradiction: The rule detects persistence via APT hooks and profile.d scripts as part of
    the 'Redis Cryptomining Persistence' detection logic. The hypothesis states adversaries use 'rogue
    Redis replication to inject malicious cron jobs'. Passage [25] explicitly links '/etc/cron.d/xminer',
    '/etc/apt/apt.conf.d/99sys-update', and '/etc/profile.d/sys-init.sh' to 'deploy_all.py', which is
    described in Passage [20] as sticking to those directories, distinct from the Redis replication mechanism
    that writes to '/etc/cron.d/.redis-miner' (Passage [6]). The rule conflates the toolkit's general
    persistence capabilities with the specific Redis exploitation method defined in the hypothesis.
