detections:
  # Detections a correct hunt contains. A detection is satisfied when one
  # rule of the category holds every `require` pair in the same selection
  # block (Sigma ANDs the fields of one map). `any_of` lists alternatives.
  # Memory/API-sequence detection needs EDR telemetry beyond Sigma's generic
  # categories, so it is not required here.
  - id: c2-http-staging-port
    description: "Connection to 38.207.178.192 on 50813 (HTTP staging)"
    any_of:
      - category: network_connection
        require:
          - {field: DestinationIp, value: '^38\.207\.178\.192$'}
          - {field: DestinationPort, value: '^50813$'}
  - id: c2-raw-tcp-port
    description: "Connection to 38.207.178.192 on 50812 (SNOWLIGHT check-in, VShell)"
    any_of:
      - category: network_connection
        require:
          - {field: DestinationIp, value: '^38\.207\.178\.192$'}
          - {field: DestinationPort, value: '^50812$'}
  - id: loader-execution
    description: "Execution of the Go loader by hash"
    any_of:
      - category: process_creation
        require:
          - {field: Hashes, value: '(?i)81c51138d5527ca7dcc258171eb36659c479f66c86a8947b6340d040b3860a30|a7cc7e3cdd2f0f9210044911a483fa5d'}
  - id: decoy-process-chain
    description: "cmd.exe spawned by the resume-named loader, or Word opening the decoy from C:\\Windows\\Temp\\"
    any_of:
      - category: process_creation
        require:
          - {field: Image, value: '(?i)cmd\.exe'}
          # The resume-named loader, not any .exe: \winword.exe must not satisfy it.
          - {field: ParentImage, value: '(?i)resume|简历'}
      - category: process_creation
        require:
          - {field: Image, value: '(?i)winword\.exe'}
          - {field: CommandLine, value: '(?i)\\windows\\temp\\.*\.docx'}
  - id: decoy-docx-written
    description: "A .docx written under C:\\Windows\\Temp\\"
    any_of:
      - category: file_event
        require:
          - {field: TargetFilename, value: '(?i)\\windows\\temp\\.*\.docx'}
  - id: staging-url-paths
    description: "Proxy/web request for either staging path, where URL paths are logged"
    any_of:
      - category: proxy
        require:
          - {field: c-uri, value: '(?i)EasyConnectUpdata_Log\.txt|MySQL_LOG\.txt'}
      - category: webserver
        require:
          - {field: cs-uri-stem, value: '(?i)EasyConnectUpdata_Log\.txt|MySQL_LOG\.txt'}
