title: Detection of XMRig C2 and Persistence-Related DNS Queries
id: 931d974b-7aeb-4960-aaaf-0bd617d68f9d
status: experimental
description: This rule detects DNS queries to known malicious domains associated with XMRig cryptominer
  deployment and persistence mechanisms, specifically targeting domains used for C2 communication and
  artifact retrieval. The behavior aligns with the T1071.001 technique, where adversaries leverage misconfigured
  Redis to inject malicious payloads via cron persistence. Queries to domains like ayakliborsa.net and
  pool.moneroocean.stream, combined with known malicious file patterns in the attack chain, indicate active
  exploitation and persistence setup.
